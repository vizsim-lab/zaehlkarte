[project]
name = "zaehlkarte"
version = "0.1.0"
description = "Pipeline der Zählkarte: kommunale Verkehrszählungen (Knoten- und Querschnittszählungen) aus mehreren Quellen in ein Schema und als Kartendaten."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "osmium>=4.0",
    "pandas>=2.2",
    "pdfplumber>=0.11.10",
    "py7zr>=0.22",
    "pyyaml>=6.0",
    "requests>=2.32",
    "typer>=0.12",
    "xlrd>=2.0.2",
]

[project.scripts]
zaehlkarte = "zaehlkarte.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "xlwt>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zaehlkarte"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
