    # OpenStreetMap (Nominatim, Overpass; Abfrage November 2026), Genauigkeit je Standort:
    # hausnummer | kreuzung | bauwerk (Mitte der Brücke) | strasse (Punkt auf der Straße) |
    # ungefaehr (Begründung im Hinweis).
