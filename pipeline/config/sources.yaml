        lizenz_url: https://www.govdata.de/dl-de/by-2-0
        herkunft_url: https://opendata.olpe.de/dataset/?q=Verkehrsmessung
      - code: cc-by
        lizenz_id: http://dcat-ap.de/def/licenses/cc-by/4.0
        lizenz_link: http://creativecommons.org/licenses/by/4.0/
        titel: "Verkehrsmessung Zum Honigsack 35 (verändert: Stundensummen aus den Einzelmessungen)"
        herausgeber: Kreisstadt Olpe
        lizenz: CC BY 4.0
        lizenz_url: https://creativecommons.org/licenses/by/4.0/deed.de
        herkunft_url: https://opendata.olpe.de/dataset/verkehrsmessung-standort-zum-honigsack-35
    # Lage: GPS des Geräts; „Zum Honigsack 35“ hat keins – Hausnummer laut Nominatim (November 2026)
    geokodierung:
      titel: Lage der Messstelle Zum Honigsack 35 (Nominatim, OpenStreetMap)
