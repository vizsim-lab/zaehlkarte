  # Belege für RP, SH, SL, TH (Recherche November 2026):
  # RP https://open.rlp.de/fileadmin/user_upload/TranspG_RP.pdf (§ 3 Abs. 1; § 7 Abs. 4: keine Pflicht
  #    zur Veröffentlichung für Gemeinden, das Antragsrecht gilt trotzdem)
  # SH https://datenschutzzentrum.de/uploads/IZGFolien.pdf (§ 2 Abs. 3: Gemeinden, Kreise, Ämter)
  # SL https://www.datenschutz.saarland.de/fileadmin/user_upload/uds/informationsfreiheit/IFG_Flyer_web.pdf
  # TH https://tlfdi.de/fileadmin/tlfdi/info/Transparenzjahr_2025/Infobroschuere_Transparenzgesetze.pdf
  #    (§ 2 Abs. 1: Gemeinden und Gemeindeverbände; § 15 Abs. 1: Gebühren höchstens 500 Euro)
  BB: Akteneinsichts- und Informationszugangsgesetz (AIG)
  BE: Berliner Informationsfreiheitsgesetz (IFG)
  BW: Landesinformationsfreiheitsgesetz (LIFG)
  BY: kein Landes-IFG – Bayerisches UIG und städtische Informationsfreiheitssatzungen
  HB: Bremer Informationsfreiheitsgesetz
  HE: HDSIG gilt für Kommunen nur, wenn sie es per Satzung einführen – sonst Hessisches UIG
  HH: Hamburgisches Transparenzgesetz
  MV: Informationsfreiheitsgesetz M-V
  NI: kein Landes-IFG – Niedersächsisches UIG
  NW: Informationsfreiheitsgesetz NRW
  RP: Landestransparenzgesetz (LTranspG) – Antragsrecht auch gegenüber Gemeinden
  SH: Informationszugangsgesetz (IZG-SH) – umfasst auch Umweltinformationen
  SL: Saarländisches Informationsfreiheitsgesetz (SIFG)
  SN: SächsTranspG gilt für Kommunen nur per Satzung – sonst Sächsisches UIG
  ST: Informationszugangsgesetz Sachsen-Anhalt (IZG LSA)
  TH: Thüringer Transparenzgesetz (ThürTG) – Gebühren höchstens 500 Euro

# Stand: in_karte | offen | geliefert | kandidat | aggregiert | nur_karte | automatisch | abgelehnt
# Kommunen mit `quelle:` liegen in der Karte; ihr Punkt kommt aus den Zählstellen.
# Vorlage für Anfragen (Text für das Feld „Anfrage“ auf FragDenStaat – Anrede, Rechtsgrundlage
# und Gebührenhinweis ergänzt FragDenStaat). {stelle} ist „Stadt {kommune}“ oder `anfrage_an`
# des Eintrags (etwa „Gemeinde Mühltal“), {zusatz} dessen `anfrage_zusatz`.
anfrage_vorlage:
  betreff: Ergebnisse von Verkehrszählungen (Knotenpunkte und Querschnitte) seit 2015
  text: |-
    Bitte übermitteln Sie mir die Ergebnisse aller Verkehrszählungen, die die {stelle} seit dem 1. Januar 2015 an Knotenpunkten und Straßenquerschnitten durchgeführt hat oder hat durchführen lassen – von Hand, per Video oder Radar; Dauerzählstellen ausgenommen. Je Zählung bitte:

    1. Bezeichnung und Lage der Zählstelle (Koordinaten oder die beteiligten Straßen, gegebenenfalls Knotennummer),
    2. Datum und gezählte Uhrzeiten,
    3. die Zählwerte je Intervall (z. B. 15 oder 60 Minuten) und je Fahrtrichtung bzw. Verkehrsstrom, getrennt nach den erhobenen Verkehrsarten (Kfz nach Fahrzeugart, Rad, zu Fuß).

    Bitte schicken Sie die Daten in dem maschinenlesbaren Format, in dem sie bei Ihnen vorliegen (z. B. CSV, XLSX oder Export der Zählsoftware); PDF-Berichte nur dort, wo es nichts anderes gibt. Eine Aufbereitung ist nicht nötig.
    {zusatz}
    Bitte nennen Sie mir außerdem, unter welchen Bedingungen ich die Daten weiterverwenden und veröffentlichen darf – am liebsten unter einer offenen Lizenz wie der Datenlizenz Deutschland – Namensnennung 2.0.

    Verkehrsmengen sind Umweltinformationen: Sie bestimmen die Belastung durch Lärm und Luftschadstoffe und gehen in Lärmkartierung und Luftreinhalteplanung ein.

