    osm: https://download.geofabrik.de/europe/germany/hamburg-latest.osm.pbf
    # Geofabrik sperrt *.osm.pbf per robots.txt für alle Robots – vermutlich gegen Crawler, die den
    # ganzen Server abgrasen. Ausnahme auf Beschluss der Projektleitung (14.11.2026): Der Abzug ist
    # der übliche Weg zu den OSM-Daten einer Stadt; Overpass war die erlaubte Alternative, aber
    # unzuverlässig (am 14.11. antwortete aus GitHub Actions nur ein Server).
    robots_ausnahme:
      urls: [https://download.geofabrik.de/europe/germany/]
      grund: >-
        Geofabrik sperrt *.osm.pbf für alle Robots; der Abzug ist der übliche Weg zu den
        OSM-Daten einer Stadt und wird nur einmal geladen
      seit: 2026-11-14
      anfrage: nicht gestellt (Beschluss der Projektleitung)
    titel: >-
      Verkehrsdaten Rad Infrarotdetektoren Hamburg (verändert: Stundenwerte zu Tagessummen
      zusammengefasst, Straßennamen aus OpenStreetMap ergänzt)
    herausgeber: Freie und Hansestadt Hamburg, Behörde für Verkehr und Mobilitätswende
    quellenvermerk: Freie und Hansestadt Hamburg, Behörde für Verkehr und Mobilitätswende
    lizenz: dl-de/by-2-0
    lizenz_url: https://www.govdata.de/dl-de/by-2-0
    hinweise:
      - >-
        Laut Quelle nicht umfassend qualitätsgesichert und nicht amtlich geprüft; Lücken können noch
        nach ein paar Tagen nachgeliefert werden. Angestrebte Genauigkeit laut Quelle: ±10 % auf
        Geh- und Radwegen und Radfahrstreifen, ±20 % im Mischverkehr; an Zählstellen, die mehrere
