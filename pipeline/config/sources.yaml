  potsdam:
    status: live
    adapter: potsdam_pdf
    name: Potsdam
    land: BB
    traeger: Landeshauptstadt Potsdam, Bereich Verkehrsentwicklung
    # Quellenangabe nach den Nutzungsbedingungen der LHP (NB-16-OGD, lizenz_url): „Name des
    # Dateninhalts © LHP/NB-16-OGD/Datum der Entnahme“, dazu ein Hinweis auf die Veränderung und
    # darauf, dass Dritte die Inhalte nur nach diesen Bedingungen nutzen dürfen. {abruf} = Datum,
    # an dem `fetch` die Zählpläne geholt hat (data/raw/potsdam/abruf.txt).
    titel: "Verkehrszählungen © LHP/NB-16-OGD/{abruf} (verändert: Werte aus den Zählplänen ausgelesen)"
    art: >-
      Knotenpunktzählungen von Hand an einem Werktag (April–Oktober), 7–10 und 15–18 Uhr; je
      Zählung nur die beiden Spitzenstunden und die Summe der sechs Stunden, nach Kfz,
      Schwerverkehr und Rad
    weg: offen auf dem Open-Data-Portal der Stadt (ein PDF je Zählung, 2010–2023)
    ferien: schulferien_brandenburg.csv
    lizenz: Nutzungsbedingungen der LHP (NB-16-OGD) – Weiterverwendung nur nach diesen
    lizenz_url: https://opendata.potsdam.de/terms/terms-of-use/
    portal: https://opendata.potsdam.de/explore/dataset/verkehrszahlungen/
    api: https://opendata.potsdam.de/api/explore/v2.1/catalog/datasets/verkehrszahlungen/exports/json
    abruf: potsdam/abruf.txt
    # robots.txt (Prüfung 14.11.2026) sperrt diese Abrufe für alle Robots, einen erlaubten Weg zu
    # den Daten gibt es nicht. Bis der Betreiber antwortet, holt die Pipeline nur diese URLs weiter
    # (Kennung zaehlkarte-pipeline, wöchentlich bzw. monatlich) – die Projektleitung will die
    # Quelle nicht verlieren, AGENTS.md „robots.txt und die Pipeline“. Ohne den Eintrag fiele sie
    # beim nächsten Abruf weg; `fetch` nennt jeden Abruf, der nur dank der Ausnahme geht.
    robots_ausnahme:
      urls:
        - https://opendata.potsdam.de/api/explore/
        - https://de.ftp.opendatasoft.com/potsdam/
      grund: >-
        Opendatasoft sperrt /api/ und die Downloads (de.ftp.opendatasoft.com ganz); die Zählpläne
        gibt es nur dort
      seit: 2026-11-14
      anfrage: noch nicht gestellt
