      Das Ordnungsamt zählt mit automatischen Geräten. Eine Anfrage 2018 nach den Daten lehnte die
      Stadt ab – es gebe keine rechtliche Grundlage für die Weitergabe von Verkehrsdaten; 2020 blieb
