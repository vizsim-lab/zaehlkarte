  moers:
    status: live
    adapter: moers_radar
    name: Moers
    land: NW
    traeger: Stadt Moers, Fachdienst Verkehr/Straße
    titel: Verkehrszählungen (Seitenradar-Messgeräte)
    art: >-
      Querschnittszählungen mit Seitenradar-Messgeräten, meist zwei Tage am Stück, beide
      Fahrspuren; Kfz je Fahrzeug, Schwerverkehr über die Fahrzeuglänge (ab 8 m)
