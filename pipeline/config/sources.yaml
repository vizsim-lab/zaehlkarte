    url_uebersicht: https://mobidata-bw.de/daten/portal/Baienfurt_Zaehl/Verkehrszaehlungen-Gemeinde-Baienfurt.xlsx
    url_zip: https://mobidata-bw.de/daten/portal/Baienfurt_Zaehl/Zaehldaten_PDF-Excel_Baienfurt.zip
  baindt:
