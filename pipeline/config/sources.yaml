    url_uebersicht: https://mobidata-bw.de/daten/portal/Berg_Zaehl/Verkehrszaehlungen-Gemeinde-Berg.xlsx
    url_zip: https://mobidata-bw.de/daten/portal/Berg_Zaehl/Zaehldaten_PDF-Excel_Berg.zip
  baienfurt:
    <<: *mobidata
    name: Baienfurt
    traeger: Gemeinde Baienfurt (aufbereitet vom Stadtplanungsamt Ravensburg)
    paket: zaehldaten-gemeinde-baienfurt
    portal: https://mobidata-bw.de/dataset/zaehldaten-gemeinde-baienfurt
    uebersicht: Verkehrszaehlungen-Gemeinde-Baienfurt.xlsx
    url_uebersicht: https://mobidata-bw.de/daten/portal/Baienfurt_Zaehl/Verkehrszaehlungen-Gemeinde-Baienfurt.xlsx
    url_zip: https://mobidata-bw.de/daten/portal/Baienfurt_Zaehl/Zaehldaten_PDF-Excel_Baienfurt.zip
  baindt:
