        - ["Archiv der Verkehrsdetektion", "https://api.viz.berlin.de/daten/verkehrsdetektion"]
        - ["Rad-Zählstellen (Senatsverwaltung)", "https://www.berlin.de/sen/uvk/verkehr/verkehrsplanung/radverkehr/weitere-radinfrastruktur/zaehlstellen-und-fahrradbarometer/"]
