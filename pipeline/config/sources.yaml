      verkehrsdaten_In_der_Wueste-20250620-20250626.json: {name: "In der Wüste, Höhe Freizeitbad"}
      verkehrsdaten_feuerwehrhaus_oberveischede_20250709-20250715.json: {name: "Oberveischede, Feuerwehrhaus"}
      verkehrsdaten_Oberveischede-20250626-20250708.json: {name: "Oberveischede, Ortseingang"}
