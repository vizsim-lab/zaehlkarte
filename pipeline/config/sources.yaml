# Familie Dauerzählstellen: fest eingebaute Zähler mit Stunden- oder Tageswerten über Jahre.
# Abgrenzung zu vizsim/svz: hier die gezählten Werte im Zeitverlauf (Stunden, Tage) – keine
# Jahresmittel, kein DTV. Eine Tagessumme nur aus allen Stunden des Tages.
dauer:
  berlin_viz:
    status: live
    adapter: berlin_viz
    name: Berlin (Verkehrsdetektion)
    land: BE
    traeger: Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt, Verkehrsinformationszentrale (VIZ)
    art: >-
      Infrarot-Detektoren (TEU) über den Fahrstreifen an rund 250 Standorten; Stundenwerte je
      Richtung (Messquerschnitt) für Kfz und Lkw, wie die Detektoren sie unterscheiden
    weg: offen im Archiv der Digitalen Plattform Stadtverkehr Berlin
    ferien: schulferien_berlin.csv
    portal: https://daten.berlin.de/datensaetze/verkehrsdetektion-berlin
    archiv: https://mdhopendata.blob.core.windows.net/verkehrsdetektion
    archiv_seite: https://api.viz.berlin.de/daten/verkehrsdetektion
    stammdaten: Stammdaten_Verkehrsdetektion_2022_07_20.xlsx
    # ab diesem Monat die neue Qualitätssicherung (Fahrstreifen -> Messquerschnitt); davor die
    # Messquerschnitte der alten wie geliefert. 2023–2024 gibt es beide – der Bericht vergleicht.
    neue_qs_ab: 2025-01
    vollstaendig_mindestens: 75  # % gültiger Messintervalle je Stunde (Regel der alten QS)
    titel: >-
      Verkehrsdetektion Berlin (verändert: Stundenwerte zu Tagessummen; ab 2025 Fahrstreifen zu
      Messquerschnitten summiert)
    herausgeber: Digitale Plattform Stadtverkehr Berlin
    quellenvermerk: Digitale Plattform Stadtverkehr Berlin / Verkehrsdetektion Berlin
    lizenz: dl-de/by-2-0
    lizenz_url: https://www.govdata.de/dl-de/by-2-0
    hinweise:
      - >-
        Laut Quelle Rohdaten, die vereinzelt Messfehler enthalten können. Die Zählkarte prüft nur,
        ob jede Stunde gezählt ist – nicht, ob die Werte plausibel sind.
  # Hamburg: zwei Dienste derselben Wärmebildkameras (aVME-HH, Hamburger Radzählnetz), ein Adapter.
  # Stundenwerte hält die Quelle nur „für die letzten zwei Monate“ vor (Datensatzbeschreibung im
  # Transparenzportal, Stand November 2026) -> die Zählkarte hebt sie selbst auf (gedaechtnis/ im
  # Rohdatenordner, vom Workflow im Release `dauerzaehlstellen` abgelegt).
  hamburg_kfz:
    status: live
    adapter: hamburg_sta
    name: Hamburg (Kfz, Wärmebildkameras)
    land: HH
    traeger: Freie und Hansestadt Hamburg, Behörde für Verkehr und Mobilitätswende
    art: >-
      Wärmebildkameras (Infrarot-Detektoren) an Kreuzungen; Stundenwerte je Zählstelle (eine
      Richtung an einem Knotenarm) für Kfz, an einem Teil der Stellen auch Schwerverkehr, wie die
      Kamera ihn erkennt
    weg: offen über die SensorThings API der Urban Data Platform Hamburg
    ferien: schulferien_hamburg.csv
    portal: https://suche.transparenz.hamburg.de/dataset/verkehrsdaten-kfz-infrarotdetektoren-hamburg14
    api: https://iot.hamburg.de/v1.1
    dienst: HH_STA_Verkehrsdaten_Kfz_Infrarotdetektoren
    layer:
      kfz: Anzahl_Kfz_Zaehlstelle_1-Stunde
      sv: Anzahl_Schwerverkehr_Zaehlstelle_1-Stunde
    nachladen_tage: 14  # so weit zurück holt jeder Lauf die Stunden erneut (Werte ändern sich noch)
    frisch_tage: 7  # jüngere Stunden kommen noch nicht in die Karte
    # Straßennamen für neue Stellen aus dem OSM-Abzug von Geofabrik (ODbL). Geladen wird er nur,
    # wenn neue Stellen ohne Namen auftauchen und noch keiner da ist, und dann behalten (Cache im
    # Workflow): Straßen ändern sich selten, und Geofabrik bittet, nicht dieselbe Datei immer
    # wieder zu laden.
    osm: https://download.geofabrik.de/europe/germany/hamburg-latest.osm.pbf
    # Geofabrik sperrt *.osm.pbf per robots.txt für alle Robots – vermutlich gegen Crawler, die den
    # ganzen Server abgrasen. Ausnahme auf Beschluss der Projektleitung (14.11.2026): Der Abzug ist
    # der übliche Weg zu den OSM-Daten einer Stadt; Overpass war die erlaubte Alternative, aber
    # unzuverlässig (am 14.11. antwortete aus GitHub Actions nur ein Server).
    robots_ausnahme:
      urls: [https://download.geofabrik.de/europe/germany/]
      grund: >-
        Geofabrik sperrt *.osm.pbf für alle Robots; der Abzug ist der übliche Weg zu den
        OSM-Daten einer Stadt und wird nur einmal geladen
      seit: 2026-11-14
      anfrage: nicht gestellt (Beschluss der Projektleitung)
    titel: >-
      Verkehrsdaten Kfz Infrarotdetektoren Hamburg (verändert: Stundenwerte zu Tagessummen
      zusammengefasst, Straßennamen aus OpenStreetMap ergänzt)
    herausgeber: Freie und Hansestadt Hamburg, Behörde für Verkehr und Mobilitätswende
    quellenvermerk: Freie und Hansestadt Hamburg, Behörde für Verkehr und Mobilitätswende
    lizenz: dl-de/by-2-0
    lizenz_url: https://www.govdata.de/dl-de/by-2-0
    hinweise:
      - >-
        Laut Quelle nicht umfassend qualitätsgesichert und nicht amtlich geprüft; Lücken können noch
        nach ein paar Tagen nachgeliefert werden. Angestrebte Genauigkeit laut Quelle: ±10 % bei
        den Verkehrsstärken, ±15 % beim Schwerverkehrsanteil.
      - >-
        Die Zählkarte übernimmt Stunden erst nach sieben Tagen und prüft nur, ob jede Stunde
        gezählt ist – nicht, ob die Werte plausibel sind.
      - >-
        Die Quelle nennt keine Straßen. Der Name ist die nächste benannte Straße aus OpenStreetMap
        (© OpenStreetMap-Mitwirkende, ODbL) und kann an Kreuzungen danebenliegen.
  hamburg_rad:
