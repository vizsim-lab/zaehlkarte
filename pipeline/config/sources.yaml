    lon: 8.7022
    lat: 49.825
    stand: aggregiert
    was: >-
      Berichte der Verkehrsmessungen seit 2022 als PDF (Summen je Zeitfenster und Richtung über den
      Messzeitraum, nach Fahrzeugklassen)
    situation: >-
      Seit einem Beschluss der Gemeindevertretung vom Februar 2022 veröffentlicht die Gemeinde ihre
      Verkehrsmessungen mit einem Seitenradar-Gerät als PDF-Bericht (etwa Kirchstraße, 15.–20.
      August 2022): je Richtung die Summen für vier Zeitfenster über den ganzen Messzeitraum, getrennt
      nach Zweirädern, Pkw, Lkw und Lastzügen, dazu die mittlere Tagesmenge und Geschwindigkeiten –
      Stundenwerte nur als Grafik. Auf eine Anfrage 2022 schrieb die Gemeinde, ältere Ergebnisse für
      Einzelne zusammenzustellen könne sie personell nicht leisten.
    empfehlung: >-
      Anfrage nach den Exporten der Messgeräte (Stundenwerte je Richtung und Fahrzeugklasse) für die
      veröffentlichten Messungen, mit Lizenz – eine Aufbereitung ist nicht nötig. Grundlage:
      Hessisches Umweltinformationsgesetz.
    weg: "FragDenStaat, Hessisches UIG"
    kontakt: {fds_suche: "Mühltal"}
    anfrage: true
    anfrage_an: Gemeinde Mühltal
    anfrage_zusatz: >-
      Ihre Berichte zu den Verkehrsmessungen (etwa Kirchstraße, August 2022) zeigen nur Summen über
      den Messzeitraum. Ich bitte um die Exporte der Messgeräte mit Stundenwerten je Richtung und
      Fahrzeugklasse für alle Messungen seit 2022 – so, wie sie vorliegen.
    links:
      - ["Verkehrsdatenerhebung Kirchstraße 2022", "https://www.muehltal.de/muehltal/artikel/presseartikel/2022/kw35-verkehrsdatenerhebung-kirchstr/"]
      - ["Verkehrsmessdaten", "https://www.muehltal.de/muehltal/buerger-service/verwaltung/buergerservice-finden/verkehrsraeume/verkehrsmessdaten/"]
      - ["FragDenStaat 2022", "https://fragdenstaat.de/anfrage/veroffentlichung-verkehrsrelevanter-messergebnisse-und-blitzaktionen-der-gemeinde-muhltal/"]
