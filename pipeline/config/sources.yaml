        rohdatei_url: https://vizsim.github.io/BerlinTrafficCounts/Rohdaten_Berlin_1992-2019/{datei}
    rohdatei_liste: berlin_rohdateien_2019-2025.txt
    geokodierung:
      titel: Geokodierung der Fuß- und Radzählungen (OSM-Straßenkreuzungen)
      herkunft_url: https://github.com/vizsim/berlin-traffic-counts_schulwege
      lizenz: ODbL (abgeleitet aus OpenStreetMap)
      lizenz_url: https://opendatacommons.org/licenses/odbl/
      datei: geokodierung_berlin.csv
      url: https://raw.githubusercontent.com/vizsim/berlin-traffic-counts_schulwege/d09e6f06aaa84dd339a6e9ea91dfbf25b642c1a0/pipeline/data/geokodierung.csv
      sha256: 111e03bd6e7b6e910e176987b2d26508242c167b45b5d385bd014f8b4b566bfe
    # Ergänzung für die übrigen Zählungen (Kfz vor 2021 ohne GPS): derselbe Geocoder, gerechnet
