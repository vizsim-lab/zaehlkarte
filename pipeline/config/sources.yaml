  olpe:
    status: live
    adapter: olpe_radar
    name: Olpe
    land: NW
    traeger: Kreisstadt Olpe, Ordnungsamt
    titel: Verkehrsmessungen
    art: >-
      Querschnittsmessungen mit Radar-Messgeräten, meist ein bis zwei Wochen am Stück; je
      Fahrzeug Zeit, Richtung und Fahrzeugklasse (Kfz, Schwerverkehr, als Radfahrer erkannt)
    weg: offen auf opendata.olpe.de (ab 2025)
    ferien: schulferien_nordrhein-westfalen.csv
    portal: https://opendata.olpe.de/dataset/?q=Verkehrsmessung
    # alle Datensätze „Verkehrsmessung(en) …“ – neue Messungen kommen beim nächsten fetch dazu.
    # Über die Suche und die Seite je Datensatz (die CKAN-API sperrt das Portal per robots.txt,
    # das DCAT-Dokument nennt keine Lizenz), Crawl-delay 10 s. Die Suche findet je nach Wortform
    # andere Datensätze – darum beide Formen und die bekannten Datensätze (`pakete`).
    ckan: https://opendata.olpe.de
    suche: [Verkehrsmessung, Verkehrsmessungen]
    paket_muster: ^verkehrsmess
    pakete:
      - verkehrsmessung-alte-landstrabe
      - verkehrsmessung-standort-zum-honigsack-35
      - verkehrsmessung-weite-schluppe
      - verkehrsmessungen-gunsestrabe
      - verkehrsmessungen-hatzenbergstrabe
      - verkehrsmessungen-in-der-wuste
      - verkehrsmessungen-k18
      - verkehrsmessungen-oberveischede
      - verkehrsmessungen-rochusstrabe
    # Lizenz je Datensatz: der Lizenz-Link auf seiner Seite (`lizenz_link`; `lizenz_id` = die
    # Kennung im Portal); ein Datensatz mit einer anderen Lizenz bleibt draußen
    lieferungen:
      - code: dl-de-by
        lizenz_id: http://dcat-ap.de/def/licenses/dl-by-de/2.0
        lizenz_link: https://www.govdata.de/dl-de/by-2-0
