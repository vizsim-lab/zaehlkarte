    situation: >-
      Für die Verkehrsuntersuchung im Kernort hat ein Planungsbüro im September 2019 an 16
      Knotenpunkten (6–10 und 15–19 Uhr) und 13 Querschnitten (24 Stunden, per Video) gezählt. Die
      „Ergebnisse der Verkehrszählungen“ (74 Seiten) stehen auf kevelaer.de: je Knotenpunkt und
      Viertelstunde die Ströme nach Pkw, Krad, Lieferwagen und Lkw, je Querschnitt Stundenwerte, dazu
      DTV und Spitzenstunden. Das ist eine Zählung, wie sie die Karte zeigt (ähnlich der aus Xanten);
      eine Lizenz nennt die Stadt aber nicht, darum ist sie noch nicht in der Karte.
    empfehlung: >-
      Bitte an die Stadt, die Zählung unter eine offene Lizenz zu stellen (etwa Datenlizenz
      Deutschland – Zero), am besten mit der Tabelle des Büros – dann kommt sie in die Karte. Dazu die
      Frage nach weiteren Zählungen seit 2015. Grundlage: IFG NRW.
    weg: "FragDenStaat, IFG NRW"
    kontakt: {fds_suche: "Stadt Kevelaer"}
    anfrage: true
    anfrage_zusatz: >-
      Die Zählung vom September 2019 (16 Knotenpunkte, 13 Querschnitte) haben Sie als PDF
      veröffentlicht. Ich bitte um diese Zählung in der Tabellenform des Büros, um die Bedingungen
      ihrer Weiterverwendung und um alle weiteren Zählungen.
