      lizenz_url: https://opendatacommons.org/licenses/odbl/
      herkunft_url: https://www.openstreetmap.org/copyright
    # Namen, wo der Titel des Datensatzes mehrere Messstellen zusammenfasst (je Datei)
    orte:
      "Zum Honigsack 35.json": {name: "Zum Honigsack 35", lon: 7.851839, lat: 51.003047}
