      titel: Lage der Zählstellen (Nominatim und Overpass, OpenStreetMap)
      lizenz: ODbL (abgeleitet aus OpenStreetMap)
      lizenz_url: https://opendatacommons.org/licenses/odbl/
      herkunft_url: https://www.openstreetmap.org/copyright
    # je Standort eine CSV; Prüfsumme der Fassung vom 4. März 2025 (letzte Änderung im Portal).
    # zeitstempel: beginn = volle Viertelstunde, Beginn des Intervalls; ende = Protokoll des
    # Geräts, Zeile kurz nach dem Ende ihres Intervalls (siehe adapters/konstanz_mobil.py).
    # art: Verkehrsart der Richtungsspalten, wenn keine Spalte eine nennt.
    standorte:
      - datei: Schottenstrasse_2.csv
        url: https://offenedaten-konstanz.de/sites/default/files/Schottenstrasse_2.csv
        sha256: afff5de2bbb586f51a9aa9b19a6368888236f285e64aff8c6817a9b2b3bd2d4f
        name: Schottenstraße
        intervall: 15
        zeitstempel: beginn
        kategorien: Fahrradfahrer inkl. Lastenräder; Auto (jegliche Kfz – Auto, Lkw usw.)
        richtungen: stadteinwärts und stadtauswärts
        lon: 9.1711434
        lat: 47.6627916
        genauigkeit: strasse
        hinweise:
          - "Lage: nur die Straße ist bekannt (Punkt in der Straßenmitte)."
      - datei: Alte_Rheinbruecke_1.csv
        url: https://offenedaten-konstanz.de/sites/default/files/Alte_Rheinbruecke_1.csv
        sha256: 63e8096187c1bd5eb3e8e36c341541f84f1c399b161f113556b7fc8d661cdbb2
        name: Alte Rheinbrücke
        intervall: 15
        zeitstempel: beginn
        art: rad
        kategorien: Fahrradfahrer inkl. Lastenräder (auch im Pulk und bei Begegnungen)
        richtungen: stadteinwärts Richtung Laube, stadtauswärts Richtung Alte Rheinbrücke
        lon: 9.17814
        lat: 47.66575
        genauigkeit: ungefaehr
        hinweise:
          - >-
            Lage ungefähr: Die Stadt nennt nur die Brücke und die Richtungen „Ri Laube“ und
