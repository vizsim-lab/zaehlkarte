    lizenz_url: https://www.govdata.de/dl-de/zero-2-0
    portal: https://opendata.ruhr/dataset/mobilitatskonzept
    # Fassung vom Juni 2025 (letzte Änderung im Portal), Prüfsumme wie bei Münster
    dateien:
