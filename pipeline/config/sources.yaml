    ferien: schulferien_nordrhein-westfalen.csv
    lizenz: dl-de/zero-2-0
    lizenz_url: https://www.govdata.de/dl-de/zero-2-0
    portal: https://www.offenesdatenportal.de/dataset/verkehrszahlung-in-moers-2021
    api: https://www.offenesdatenportal.de/api/3/action/package_show?id={paket}
