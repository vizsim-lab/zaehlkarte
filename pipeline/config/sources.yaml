      Zählstelle und Jahr; dazu Wärmebildkameras an über 400 Kreuzungen (automatisch, in der
      Karte als Dauerzählstellen)
    situation: >-
      Hamburg zählt anlassbezogen an Bedarfszählstellen, meist von Hand von 6 bis 19 Uhr an
      Normalwerktagen. Offen (dl-de/by-2-0) sind davon nur die hochgerechneten Tageswerte (DTV,
      DTVw) und der Schwerverkehrsanteil je Zählstelle, Richtung und Jahr, nicht die gezählten
      Werte. Laut Leistungsverzeichnis der Ausschreibung 2022 zählen die beauftragten Büros in
      15-Minuten-Intervallen (Kfz in zwei Klassen, Rad, Fuß) und tragen die Werte je Fahrbeziehung in
      die Zähldatenbank der Stadt ein. Dazu kommen automatische Dauerzählungen mit Wärmebildkameras
      an über 400 Kreuzungen; ihre Stundenwerte (Kfz, Schwerverkehr, Rad) zeigt die Karte als
      Dauerzählstellen.
    empfehlung: >-
      Die gezählten Werte der Bedarfszählungen (je Intervall, Richtung und Fahrzeugart) nach dem
      Hamburgischen Transparenzgesetz anfragen – die Zählstellen sind mit Lage bekannt.
    weg: "FragDenStaat, Hamburgisches Transparenzgesetz"
    kontakt: {fds_suche: "Behörde für Verkehr und Mobilitätswende"}
    anfrage: true
    anfrage_zusatz: >-
      Im Transparenzportal stehen zu den Bedarfszählstellen nur die hochgerechneten
      Verkehrsstärken (DTV, DTVw, Schwerverkehrsanteil). Ich bitte um die Ergebnisse der
      zugrunde liegenden Zählungen selbst, also die gezählten Werte je Intervall (meist 6 bis 19
      Uhr) mit Zählstelle und Datum. Nach Ihrem Leistungsverzeichnis (Vergabe FB 2022001735) liegen
      sie in 15-Minuten-Intervallen je Fahrbeziehung in Ihrer Datenbank vor; ein Export genügt.
    links:
      - ["Leistungsverzeichnis 2022 (Transparenzportal)", "https://suche.transparenz.hamburg.de/dataset/technisches-leistungsverzeichnis-durchfuehrung-von-verkehrszaehlungen-fb-2022001735"]
