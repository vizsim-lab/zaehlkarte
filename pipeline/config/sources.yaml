      - >-
        Eco-Counter füllt Ausfälle teils rechnerisch auf („rekonstruiert“). MobiData BW kennzeichnet
        solche Werte nicht – im älteren Format mit Status (Juni 2025) stecken sie mit drin. Die
        Zählkarte kann sie deshalb nicht erkennen: An einzelnen Stellen kann ein Ausfall als
        vollständig gezählter Tag erscheinen.
      - >-
        Je Zählstelle beide Richtungen zusammen; Kanäle für Pkw und Personen zählt MobiData BW nicht
        mit. Nicht in der Karte: zwei Zählstellen, deren Name Fuß- und Radverkehr nennt, ein Gerät,
        dessen Zählstellen schon einzeln darin stehen, und eine Zählstelle des Landes.
      - >-
        Laut Quelle können sich Aufbau und Zusammensetzung der Zählstellen ohne Ankündigung ändern;
        Umleitungen und Baustellen beeinflussen die Werte.
      - >-
        Die Zählkarte übernimmt Stunden erst nach drei Tagen und prüft nur, ob jede Stunde gezählt
        ist – nicht, ob die Werte plausibel sind.
