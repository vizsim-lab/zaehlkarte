# Lage: Die Tabellen nennen Straße und Bezug („westl. Belthlestraße“), die Vorlage teils mehr
# („Ecke Kielmeyerstraße“). Punkte aus OpenStreetMap (Overpass, November 2026), Genauigkeit:
# kreuzung (am Knoten) | strasse (auf der Straße neben dem genannten Bezug, etwa 30 m) | bauwerk
# (Brücke, Tunnelportal) | ungefaehr (Begründung im Hinweis).
geokodierung:
  titel: Lage der Zählstellen (OpenStreetMap, nach den Angaben der Tabellen und der Vorlage)
  lizenz: ODbL (abgeleitet aus OpenStreetMap)
  lizenz_url: https://opendatacommons.org/licenses/odbl/
  herkunft_url: https://www.openstreetmap.org/copyright
# Zählstellen: `kaesten` = Kästen der Tabellen („Straße | Zusatz“; Kfz- und Rad-Kasten einer Stelle
# ergeben am selben Tag eine Zählung), `je_richtung` = je Richtung ein Kasten (Summe beider
# Richtungen), `vermerk` = der Ort steht im Vermerk unter der Spalte (Teilorte). Nicht genannt und
# damit nicht in der Karte: „Mühlstraße | nur Bus“ und „Kfz ohne Bus“ (Teilmengen der Stelle
# Mühlstraße), Spalten ohne Datum und Hochrechnungen.
stellen:
  # Kernstadt Ost
  - id: kusterdinger
    name: Kusterdinger Straße (Neckarbrücke)
    kaesten: ["Kusterdinger Straße | Neckarbrücke"]
  - id: stuttgarter
    name: Stuttgarter Straße südlich der Adlerkreuzung
    je_richtung:
      Richtung Norden: "Stuttgarter Straße | südl. Adlerkreuzung nach Nord"
      Richtung Süden: "Stuttgarter Straße | südl. Adlerkreuzung nach Süd"
  - id: wilhelm_adler
    name: Wilhelmstraße westlich der Adlerkreuzung
    kaesten: ["Wilhelmstraße | westl. Adlerkreuzung"]
  - id: wilhelm_nordring
    name: Wilhelmstraße östlich des Nordrings
    kaesten: ["Wilhelmstraße | östl. Nordring"]
  # Kernstadt Mitte
  - id: wilhelm_lustnauer_tor
    name: Wilhelmstraße nördlich des Lustnauer Tors
    kaesten: ["Wilhelmstraße | nördl. Lustnauer Tor"]
  - id: stadtgraben
    name: Am Stadtgraben westlich des Lustnauer Tors
    kaesten: ["Am Stadtgraben | westl. Lustnauer Tor"]
  - id: lustnauer_tor
    name: Lustnauer Tor zwischen Stadtgraben und Doblerstraße
    kaesten: ["Lustnauer Tor | zw. Stadtgr. und Doblerstr."]
  - id: muehlstrasse
    name: Mühlstraße südlich des Lustnauer Tors
    kaesten: ["Mühlstraße | alle Kfz", "Mühlstraße | südl. Lustnauer Tor"]
  - id: eberhardsbruecke
    name: Eberhardsbrücke (Nordseite)
    kaesten: ["Eberhardsbrücke | Nordseite"]
  - id: gartenstrasse
    name: Gartenstraße (Ecke Kielmeyerstraße)
    kaesten: ["Gartenstraße"]
  # Kernstadt West
  - id: westbahnhof
    name: Westbahnhofstraße westlich der Belthlestraße
    kaesten: ["Westbahnhofstraße | westl. Belthlestraße"]
  - id: schleifmuehle
    name: Schleifmühleweg westlich der Rappstraße
    kaesten: ["Schleifmühleweg | westl. Rappstraße"]
  - id: hagellocher
    name: Hagellocher Weg westlich der Rosentalstraße
    kaesten: ["Hagellocher Weg | westl. Rosentalstraße"]
  - id: hegel
    name: Hegelstraße westlich der Derendinger Straße
    kaesten: ["Hegelstraße | westl. Derendinger Straße"]
  - id: schnarrenberg
    name: Schnarrenbergstraße nördlich der Herrenberger Straße
    kaesten: ["Schnarrenbergstraße | nördl. Herrenberger Str."]
  - id: tunnel
    name: B 296, Schloßbergtunnel (Nordportal)
    kaesten: ["B 296/Tunnel | Nordportal"]
  # Teilorte
  - id: buehl_knollstrasse
    name: Bühl, Eugen-Bolz-Straße östlich der Knollstraße
    kaesten: ["Bühl | Eugen-Bolz-Straße"]
    vermerk: östl. Knollstr.
  - id: buehl_bonlanden
    name: Bühl, Eugen-Bolz-Straße westlich Bonlanden
    kaesten: ["Bühl | Eugen-Bolz-Straße"]
    vermerk: westl. Bonlanden
  - id: hirschau
    name: Hirschau, Kingersheimer Straße östlich der Industriestraße
    kaesten: ["Hirschau | östl. Industriestraße"]
  - id: kilchberg
    name: L 370 westlich Weilheim (Westarm des Knotens Weinbergstraße/Alte Landstraße)
    kaesten: ["Kilchberg | L 370"]
    vermerk: westl. Weilheim
  - id: unterjesingen_parkplatz
    name: Unterjesingen, Parkplatz am östlichen Ortsende
    kaesten: ["Unterjesingen"]
    vermerk: Parkplatz Ost
  - id: unterjesingen_rottenburger
    name: Unterjesingen, Ostarm des Knotens Hauptstraße/Rottenburger Straße
    kaesten: ["Unterjesingen"]
    vermerk: östl. Rott. Str.
  - id: weinberg_friedhof
    name: Weinbergstraße am Alten Friedhof (Derendingen)
    kaesten: ["Weilheim | Weinbergstraße"]
    vermerk: Friedhof
  - id: weinberg_alte_landstrasse
    name: Weilheim, Weinbergstraße östlich der Alten Landstraße
    kaesten: ["Weilheim | Weinbergstraße"]
    vermerk: östl. Alte Landstr.
