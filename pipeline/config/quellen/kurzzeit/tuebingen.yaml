# Lage: Die Tabellen nennen Straße und Bezug („westl. Belthlestraße“), die Vorlage teils mehr
# („Ecke Kielmeyerstraße“). Punkte aus OpenStreetMap (Overpass, November 2026), Genauigkeit:
# kreuzung (am Knoten) | strasse (auf der Straße neben dem genannten Bezug, etwa 40 m) | bauwerk
# (Brücke, Tunnelportal) | ungefaehr (Begründung im Hinweis).
geokodierung:
  titel: Lage der Zählstellen (OpenStreetMap, nach den Angaben der Tabellen und der Vorlage)
  lizenz: ODbL (abgeleitet aus OpenStreetMap)
  lizenz_url: https://opendatacommons.org/licenses/odbl/
  herkunft_url: https://www.openstreetmap.org/copyright
# Zählstellen: `kaesten` = Kästen der Tabellen („Straße | Zusatz“; Kfz- und Rad-Kasten einer Stelle
# ergeben am selben Tag eine Zählung), `je_richtung` = je Richtung ein Kasten (Summe beider
# Richtungen), `vermerk` = der Ort steht im Vermerk unter der Spalte (Teilorte; am Hagellocher Weg
# der Wert der Dauerzählstelle). Nicht genannt und damit nicht in der Karte: „Mühlstraße | nur
# Bus“ und „Kfz ohne Bus“ (Teilmengen der Stelle Mühlstraße), Spalten ohne Datum und
# Hochrechnungen. Genauigkeit „strasse“: etwa 40 m neben dem genannten Bezug.
