# Tübingen: Verkehrszählungen an einzelnen Werktagen (24 Stunden, Kfz und Rad) aus dem „Bericht
# Verkehrszählungen Juni/Juli 2022“ (Vorlage 242/2022) im Ratsinformationssystem der Stadt, ohne
# Lizenzangabe – in der Karte nach dem Beschluss vom 14.11.2026 („Quellen ohne Lizenz“,
# CLAUDE.md). Aufbau und Regeln im Kopf des Adapters (src/zaehlkarte/adapters/tuebingen_pdf.py);
# geprüft im Werkzeug-Branch `werkzeug/bw` (tools/bw_ol.py, November 2026). Anlage 2 (Monatsmittel
# der Rad-Dauerzählstellen) bleibt draußen: Mittel über Tage; die Rad-Zählstellen stehen über
# MobiData BW bei den Dauerzählstellen.
nr: 13
status: live
adapter: tuebingen_pdf
name: Tübingen
land: BW
traeger: Universitätsstadt Tübingen (Bericht Verkehrszählungen Juni/Juli 2022)
titel: Bericht Verkehrszählungen Juni/Juli 2022 (Vorlage 242/2022), Anlagen 1 und 3
art: >-
  Zählungen an einzelnen Werktagen über 24 Stunden je Querschnitt, Kfz und an einigen Stellen
  Rad, 2011–2022 (Kernstadt: Vergleich zum Verkehrsversuch Mühlstraße; Teilorte: neue B 28)
weg: Anlagen zur Vorlage 242/2022 im Ratsinformationssystem der Stadt (PDF)
portal: https://www.tuebingen.de/gemeinderat/vo0050.asp?__kvonr=16692
ohne_lizenz:
  herausgegeben: >-
    als Anlagen zur Vorlage 242/2022 im Ratsinformationssystem der Stadt (PDF), ohne
    Lizenzangabe
  geprueft: 2026-11-15
# Fassung vom August 2022, Prüfsumme wie bei Xanten
dateien:
