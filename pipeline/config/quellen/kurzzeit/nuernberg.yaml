# Nürnberg: jährliche Querschnittszählung des Verkehrsplanungsamts (Kfz 6–22 Uhr je Zählstelle)
# aus den Berichten „Verkehrszählung …“ 2007–2025 (je Jahr ein PDF auf nuernberg.de), ohne
# Lizenzangabe – in der Karte nach dem Beschluss vom 14.11.2026 („Quellen ohne Lizenz“,
# CLAUDE.md). Aufbau und Regeln im Kopf des Adapters (src/zaehlkarte/adapters/nuernberg_pdf.py);
# geprüft im Werkzeug-Branch `werkzeug/erkundung` (tools/nuernberg/, November 2026). Die Werte
# 1997–2006 in den Tabellen der älteren Berichte bleiben draußen: ohne eigenen Bericht kein Zähltag.
nr: 15
status: live
adapter: nuernberg_pdf
name: Nürnberg
land: BY
traeger: Stadt Nürnberg, Verkehrsplanungsamt
titel: Verkehrszählung (Querschnittszählung) – Berichte 2007–2025
art: >-
  Jährliche Querschnittszählung von Hand an rund 75–135 Stellen, Dienstag und Mittwoch der
  vorletzten Schulwoche vor den Sommerferien, 6–22 Uhr in vier Intervallen à vier Stunden an zwei
  Tagen; in den Berichten je Zählstelle nur die Summe Kfz 6–22 Uhr
weg: offen auf nuernberg.de (je Jahr ein Bericht als PDF), ohne Lizenzangabe
ohne_lizenz:
  herausgegeben: >-
    als Berichte „Verkehrszählung …“ (PDF) auf nuernberg.de, ohne Lizenzangabe; die Werte stehen im
    Anhang jedes Berichts (Tabelle „Entwicklung des Verkehrs (Kfz/16 h) – Zählstellen“)
  geprueft: 2026-11-15
portal: https://www.nuernberg.de/internet/verkehrsplanung/verkehrszaehlungen.html
hinweise:
  - >-
    Gezählt an zwei Tagen: Dienstag 10–14 und 18–22 Uhr, Mittwoch 6–10 und 14–18 Uhr (Berichte
    2007 und 2025). Die 16 Stunden stammen also aus zwei Tagen; die Zählung trägt das Datum des
    Dienstags.
  - >-
    Nur Kfz (beide Richtungen zusammen). Lkw und Lastzüge nennen die Berichte ab 2023 ohne Busse –
    das ist nicht der Schwerverkehr der Karte und fehlt darum.
