# Lage: je Zählstellennummer aus OpenStreetMap nach dem Namen – Hausnummer, sonst „Straße (östl. X)“:
# Kreuzung, 35 m in die Richtung versetzt; Brücke, Tunnel, Bahn- und Autobahnbrücke, Stadtgrenze –
# und aus den Zählstellenplänen der Berichte 2012 und 2022–2025 (Vektorkarten, über sicher verortete
# Zählstellen auf Koordinaten umgerechnet, im Mittel 30–45 m Abweichung). Weichen Regel und Plan um
# mehr als 150 m ab und stimmen mindestens zwei Pläne überein, gilt der Plan, auf die Straße gelegt.
# Varianten einer Nummer mit derselben Straße teilen sich die Lage; wo eine Nummer in verschiedenen
# Jahren an verschiedenen Stellen liegt, wählt `wenn` (Teil des Namens) die Lage, der Eintrag ohne
# `wenn` gilt für die übrigen Namen. Ohne Lage bleiben Rampen, Parkplatzausfahrten und einzelne
# Plätze (20 Nummern). Werkzeuge und OSM-Abzüge (15.11.2026): Branch werkzeug/erkundung,
# tools/nuernberg/ (Ablauf im README dort) und ergebnis/ohne_lizenz/holen23–30.
