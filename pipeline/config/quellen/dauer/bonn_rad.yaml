hinweise:
  - >-
    Die Stadt veröffentlicht die Stundenwerte einmal im Jahr als Jahresdatei; in der Karte 2020,
    2021 und ab 2023. Es fehlen 2019 (bei Open.NRW unter einer geschlossenen Lizenz geführt) und
    2022: Die Datei 2022 nennt nur Kanäle, und die Kanäle einer Zählstelle zählen dort
    gleichzeitig – welche zusammen die Stelle ergeben, sagt die Datei nicht.
  - >-
    Die Summen je Brücke (Kennedy-, Nord- und Südbrücke) sind nicht übernommen – ihre beiden
    Seiten stehen als eigene Zählstellen in der Karte (Namen wie in der Quelle).
  - >-
    Die Daten nennen keine Lage; sie stammt aus OpenStreetMap (© OpenStreetMap-Mitwirkende,
    ODbL), wo die Zählstellen der Stadt mit ihrer Kennung eingetragen sind. Der Stadtplan der
    Stadt mit den Standorten war beim Abruf nicht erreichbar.
  - >-
    Am Tag der Rückstellung der Uhr steht 2 Uhr in der Quelle nur einmal – dieser Tag gilt als
    nicht vollständig gezählt. Am Tag der Sommerzeit führt sie 3 Uhr zweimal, einmal leer; die
    leere Zeile zählt nicht.
  - >-
    Die Quelle führt keinen Status – ob Werte rekonstruiert sind, ist nicht erkennbar. Ganze
    Tage mit 0 kommen vor (etwa an der Südbrücke 2020) und erscheinen als gezählte Tage; am Mc
    Cloy Weg stehen von Juni bis August 2025 Tageswerte von 10.000 bis über 50.000, ein
    Vielfaches der übrigen Monate – in der Karte wie geliefert.
  - >-
    Die Zählkarte prüft nur, ob jede Stunde gezählt ist – nicht, ob die Werte plausibel sind.
