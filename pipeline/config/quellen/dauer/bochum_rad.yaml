# Rad-Zählstellen, zweite Runde (November 2026): die übrigen Quellen des Artefakts
# „Offene Radzähldaten“, gegen die nichts spricht (Werkzeug-Branch `werkzeug/dauer2`,
# tools/rad_erkunden12–14.py). Aufbau und Fallen im Adapter und in AGENTS.md.
# Bochum: Lizenz laut Portal der Stadt (bochum.opendata.ruhr) und README dl-de/by-2-0, dazu eine
# Nutzungsbeschränkung in der Datensatzbeschreibung (kein Wettbewerb zu Eco-Counter) – sie steht
# in `lizenz`, damit sie in der Seitenleiste und in jeder Zeile des CSV-Exports mitkommt.
nr: 16
status: live
