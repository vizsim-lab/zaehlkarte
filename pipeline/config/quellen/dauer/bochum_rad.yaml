  Zählstellen für Rad- und Fußverkehr (Eco-Counter); 15-Minuten-Werte je Richtung, in der Karte
  Rad und – wo eigene Kanäle zählen – Fuß, je Verkehrsart beide Richtungen zusammen
weg: offen im GitLab der Stadt auf openCode.de (täglich aktualisiert)
portal: https://gitlab.opencode.de/StadtBochum/open-data/radverkehr-zaehlstellen-eco-counter
api: https://gitlab.opencode.de/api/v4
projekt: StadtBochum/open-data/radverkehr-zaehlstellen-eco-counter
stellen:  # Ordner im Repository; Name und Lage laut Tabelle im README
  wittener_strasse: {name: Wittener Straße, lat: 51.479338, lon: 7.225140}
  springorumtrasse: {name: Springorumtrasse, lat: 51.468826, lon: 7.229204}
  brueckstrasse: {name: Brückstraße, lat: 51.485022, lon: 7.215437}
  universitaetsstrasse: {name: Universitätsstraße, lat: 51.457704, lon: 7.238026}
  erzbahntrasse: {name: Erzbahntrasse, lat: 51.487049, lon: 7.184623}
  hofsteder_bach: {name: Hofsteder Bach, lat: 51.501092, lon: 7.186044}
  lothringentrasse: {name: Lothringentrasse, lat: 51.510388, lon: 7.261104}
  springorumtrasse_sued: {name: Springorumtrasse Süd, lat: 51.442427, lon: 7.182626}
  bluecherstrasse: {name: Blücherstraße, lat: 51.491676, lon: 7.160200}
ohne:
  springorumtrasse_sued: >-
    laut README der Stadt Verdacht auf fehlende Rad-Kanäle („Bias“, Korrektur wartet auf
    Eco-Counter) – die Summe wäre zu klein
titel: >-
  Rad- und Fußverkehr – Zählstellen Eco-Counter, Stadt Bochum (verändert: 15-Minuten-Werte zu
  Stunden und Tagessummen zusammengefasst)
herausgeber: Stadt Bochum
quellenvermerk: Stadt Bochum
lizenz: >-
  dl-de/by-2-0, mit Nutzungsbeschränkung der Stadt: nicht für Produkte oder Services im direkten
  Wettbewerb zu Eco-Counter
lizenz_url: https://www.govdata.de/dl-de/by-2-0
hinweise:
  - >-
    Lizenz laut Portal der Stadt (bochum.opendata.ruhr) und README des Repositories:
    Datenlizenz Deutschland – Namensnennung 2.0. Die Datensatzbeschreibung schränkt ein: „Die
    Nutzung dieser Daten für Produkte oder Services, die im direkten Wettbewerb zu Eco-Counter
    stehen, ist nicht gestattet.“ Das gilt auch für die Werte aus der Zählkarte. (Open.NRW führt
    die Datensätze unter „Andere geschlossene Lizenz“, die Lizenzdatei des Repositories nennt
    CC0 – maßgeblich ist hier das Portal der Stadt.)
  - >-
    Laut Stadt Rohdaten ohne Gewähr; die Stadt fasst die Kanäle der Eco-Counter-API selbst
    zusammen. Die Springorumtrasse Süd fehlt, weil die Stadt dort fehlende Rad-Kanäle vermutet.
    Rad und Fuß zählen eigene Kanäle (Spalten „radfahrende_…“ und „passanten_…“); Fuß steht
    nur an den Stellen in der Karte, die Passanten zählen.
  - >-
    Am Tag der Rückstellung der Uhr fehlt in der Quelle eine der beiden Stunden von 2 bis 3 Uhr –
    dieser Tag gilt als nicht vollständig gezählt.
  - >-
    Die Zählkarte prüft nur, ob jede Stunde gezählt ist – nicht, ob die Werte plausibel sind.
