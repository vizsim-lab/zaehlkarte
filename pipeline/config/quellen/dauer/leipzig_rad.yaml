hinweise:
  - >-
    Die Quelle hält die Stundenwerte nur 31 Tage vor; die Zählkarte hebt sie seit ihrem ersten
    Abruf im November 2026 selbst auf – ältere Stunden fehlen in der Karte.
  - >-
    Die Tageswerte der Quelle (zwei Jahre) sind nicht übernommen: Ohne Stunden lässt sich nicht
    prüfen, ob ein Tag vollständig gezählt ist; sie weichen zudem meist etwas von der Summe der
    Stundenwerte ab. Die Zählstelle Jahnallee liefert keine Stundenwerte.
  - >-
    Die Zählkarte prüft nur, ob jede Stunde gezählt ist – nicht, ob die Werte plausibel sind.
