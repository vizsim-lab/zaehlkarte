hinweise:
  - >-
    Die Quelle enthält keine Stunde mit dem Wert 0; es fehlen Stunden, fast nur nachts (2 bis 4
    Uhr), vermutlich Stunden ohne Passanten. Die Zählkarte füllt nichts auf: Ein Tag mit fehlender
    Stunde gilt als nicht vollständig gezählt (2021 fast jeden zweiten Tag).
  - >-
    Am Tag der Rückstellung der Uhr steht 2 Uhr nur einmal – ob mit beiden Stunden, ist nicht
    eindeutig; dieser Tag gilt als nicht vollständig gezählt.
  - >-
    Die Zählkarte prüft nur, ob jede Stunde gezählt ist – nicht, ob die Werte plausibel sind.
