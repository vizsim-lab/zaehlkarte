hinweise:
  - >-
    Die Quelle liefert nur Tageswerte, keine Stunden: Ob an einem Tag jede Stunde gezählt ist,
    lässt sich nicht prüfen. Die Karte zeigt den Tageswert, wie die Quelle ihn liefert (auch 0);
    ein leerer Wert gilt als nicht gezählt.
  - >-
    Den letzten Tag der Datei – den Tag, an dem sie erstellt wurde – übernimmt die Zählkarte
    nicht: Er ist nur zum Teil gezählt.
  - >-
    Die Datei endet am 11.08.2026; seither ist sie nicht fortgeschrieben (Stand 14.11.2026).
  - >-
    Lage nach der Beschreibung der Station über die Straßen in OpenStreetMap (© OpenStreetMap-
    Mitwirkende, ODbL) – die Quelle nennt keine Koordinaten.
