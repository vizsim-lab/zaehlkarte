# Dauerzählstellen des Landes Baden-Württemberg (November 2026; seit dem Beschluss vom 14.11.2026
# kommen auch Zählstellen von Land und Bund in die Karte). Aufbau, Prüfkennzeichen und Lage im
# Kopf des Adapters (src/zaehlkarte/dauer/bw_land.py) und in AGENTS.md; geprüft im Werkzeug-Branch
# `werkzeug/bw` (tools/bw_dauer.py bis bw_dauer4.py) mit der Formatbeschreibung der BASt.
nr: 25
status: live
adapter: bw_land
ebene: land  # Zählstellen des Landes: gehören zu keiner Kommune der Datenlage
name: Baden-Württemberg (Kfz, Dauerzählstellen des Landes)
land: BW
traeger: Land Baden-Württemberg, Verkehrsministerium
art: >-
  fest eingebaute Zählgeräte (TLS, 8+1 Fahrzeugarten) an Autobahnen, Bundes- und Landesstraßen,
  eine an einer Kreis-, zwei an Gemeindestraßen; Stundenwerte je Fahrstreifen für Kfz und
  Schwerverkehr, an Zählstellen mit nur zwei Klassen statt des Schwerverkehrs die Lkw-ähnlichen
weg: offen bei MobiData BW (ein ZIP je Monat seit 2025, je Jahr 2016–2024)
portal: https://mobidata-bw.de/dataset/stundenwerte_dauerzaehlstellen
portal_basis: https://mobidata-bw.de
datensatz: stundenwerte_dauerzaehlstellen
ab: 2025-01  # Monats-ZIPs laut DCAT-Dokument ab diesem Monat
archiv:  # Jahres-ZIPs (nicht im DCAT-Dokument, aber in der Beschreibung des Datensatzes)
  von: 2016
  bis: 2024
  url: https://mobidata-bw.de/vm/Stundenwerte_Dauerzaehlstellen_BW/Stundenwerte_{jahr}.zip
karte:  # Lage: Grunddaten der Zählstellenkarte (die jüngste CSV des Datensatzes)
  datensatz: karte_strassenverkehrszaehlung
  muster: "SVZ-Zaehlstellen_.*\\.csv$"
titel: >-
  Stundenwerte der Dauerzählstellen in Baden-Württemberg; Lage aus der Karte der
  Straßenverkehrszählung in Baden-Württemberg (verändert: Fahrstreifen je Richtung und Stunden zu
  Tagessummen zusammengefasst)
herausgeber: Verkehrsministerium Baden-Württemberg
quellenvermerk: Verkehrsministerium Baden-Württemberg (MobiData BW)
lizenz: dl-de/by-2-0
lizenz_url: https://www.govdata.de/dl-de/by-2-0
hinweise:
  - >-
    Je Fahrtrichtung eine Stelle (beide am selben Punkt), Wert = Summe ihrer Fahrstreifen. Eine
    Stunde zählt nur, wenn die Quelle sie auf allen Fahrstreifen der Richtung als korrekt
    kennzeichnet („-“, auch „u“: korrekt, aber unregelmäßig, etwa bei Großveranstaltungen).
    Ausfälle (a), fehlerhafte Werte (d), Schätzwerte (s, k), nachträglich eingefügte Stunden (i)
    und Kennzeichen, die die Formatbeschreibung der BASt nicht nennt (h, t, S), gelten als nicht
    gezählt – je nach Monat rund ein Zehntel bis ein Drittel der Stunden, oft ein ganzer Monat an
    einer Stelle und an manchen Monatsgrenzen die erste oder letzte Stunde an vielen Stellen.
  - >-
    Schwerverkehr ist die Gruppe der Zählgeräte (Lkw ohne und mit Anhänger, Sattelzüge, Busse);
    an Zählstellen, die nur zwei Klassen unterscheiden (41 an Autobahnen, bis Dezember 2025),
    stehen statt des Schwerverkehrs die Lkw-ähnlichen Fahrzeuge als Lkw. Beides nicht der Schwerverkehr der
    Kurzzeitzählungen.
  - >-
    Ortszeit. Am Tag der Rückstellung der Uhr enthält die Quelle für 2–3 Uhr nur einen Wert, der
    mit „z“ gekennzeichnet ist – der Tag ist dort nicht vollständig gezählt.
  - >-
    Die Dateien nennen keine Koordinaten. Die Lage ist die des Abschnitts in der Zählstellenkarte
    des Landes, unter dessen Nummer die Datei geliefert wurde (Straße muss passen, Abschnitte
    von Dauerzählstellen zuerst). Zählstellen ohne passenden Abschnitt fehlen in der Karte.
  - >-
    Die Monate erscheinen mit rund zwei Monaten Verzug; ältere Monate ersetzt das Land
    gelegentlich – die Zählkarte lädt sie dann neu.
