basis: https://open-data.dortmund.de
datensatz: fb61-dauerzaehlstelle-radverkehr-schnettkerbruecke
stellen:  # Lage nicht im Datensatz: Knoten 5639350907 in OpenStreetMap
  # (© OpenStreetMap-Mitwirkende, ODbL), „Dauerzählstelle Radverkehr“ mit Verweis auf die
