hinweise:
  - >-
    Je Viertelstunde beide Richtungen zusammen; eine Stunde ist gezählt, wenn alle vier
    Viertelstunden einen Wert haben.
  - >-
    Der Datensatz nennt keine Koordinaten; die Lage stammt aus OpenStreetMap
    (© OpenStreetMap-Mitwirkende, ODbL), wo die Zählstelle mit ihrer Anzeigetafel eingetragen
    ist.
  - >-
    Am Tag der Rückstellung der Uhr fehlt in der Quelle eine der beiden Stunden von 2 bis 3 Uhr –
    dieser Tag gilt als nicht vollständig gezählt.
  - >-
    Die Zählkarte prüft nur, ob jede Stunde gezählt ist – nicht, ob die Werte plausibel sind.
