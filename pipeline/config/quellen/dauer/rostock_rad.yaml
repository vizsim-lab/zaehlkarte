hinweise:
  - >-
    Die Quelle führt keinen Status – ob Werte rekonstruiert sind, ist nicht erkennbar. Ganze Tage
    mit 0 kommen vor (etwa an der Zählstelle Graal-Müritz) und erscheinen als gezählte Tage.
  - >-
    Holbeinplatz und Lange Straße sind laut Quelle die Summe zweier Messquerschnitte (Nord und
    Süd). Saarplatz Lindenpark (laut Quelle „Steuergerät“) fehlt, weil seine Werte die der
    Zählstelle Saarplatz Nord einschließen dürften.
  - >-
    Am Tag der Rückstellung der Uhr ist die Stunde 2–3 Uhr in der Quelle unvollständig – dieser
    Tag gilt als nicht vollständig gezählt.
  - >-
    Die Zählkarte prüft nur, ob jede Stunde gezählt ist – nicht, ob die Werte plausibel sind.
