ohne:  # Zählstellen, die nicht in die Karte kommen, mit Grund
  "300041920": >-
    Saarplatz Lindenpark – laut Quelle „Steuergerät“; seine Tageswerte liegen stets etwas über
    denen der Zählstelle Saarplatz Nord (100 m entfernt), vermutlich die Summe mehrerer
