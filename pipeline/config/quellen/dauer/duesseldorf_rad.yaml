hinweise:
  - >-
    Die Stadt veröffentlicht die Stundenwerte einmal im Jahr, je Zählstelle eine Datei; in der
    Karte ab 2020 (vorher unter geschlossener Lizenz). Für 2022 gibt es keine Dateien. 2021
    steht für „Koblenzer Straße einwärts, nach Theodor-Litt-Straße“ eine Kopie der Datei „vor
    Theodor-Litt-Straße“ – nicht übernommen.
  - >-
    Je Zählstelle alle Richtungen zusammen; eine Stunde ist gezählt, wenn jede Richtung einen
    Wert hat. Nicht in der Karte: Fleher Deich Rampe, Oberkasseler Brücke und Koblenzer Straße –
    laut Daten die Summen anderer Zählstellen; Kölner Straße 186 und Pempelforter Straße 42 –
    keine Lage gefunden.
  - >-
    Die Quelle unterscheidet nicht immer zwischen einem Ausfall und null Rädern: Friedrichstraße
    2023 und Luegallee 2025 führen jede gezählte Stunde mit 0, Luegallee schon 2024 die meisten
    Tage – in der Karte als gezählte Tage. Am Mannesmannufer stehen 2020 viele Stunden doppelt;
    sie gelten als nicht gezählt.
  - >-
    Lage laut den Standorten der Stadt (dl-de/zero-2-0); Hofgartenrampe und Luegallee fehlen
    dort und stammen aus OpenStreetMap (© OpenStreetMap-Mitwirkende, ODbL).
  - >-
    Am Tag der Rückstellung der Uhr steht 2 Uhr in der Quelle nur einmal – dieser Tag gilt als
    nicht vollständig gezählt.
  - >-
    Die Quelle führt keinen Status – ob Werte rekonstruiert sind, ist nicht erkennbar.
  - >-
    Die Zählkarte prüft nur, ob jede Stunde gezählt ist – nicht, ob die Werte plausibel sind.
