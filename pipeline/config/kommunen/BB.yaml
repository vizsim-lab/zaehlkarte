      veröffentlicht.
    empfehlung: >-
      Anfrage nach den Zählungen 2025 (Werte je Intervall, Strom bzw. Richtung und Verkehrsart), mit
      Lizenz. Grundlage: Akteneinsichts- und Informationszugangsgesetz.
    weg: "FragDenStaat, AIG Brandenburg"
    anfrage:
      zusatz: >-
        Für die Fortschreibung Ihres Verkehrsentwicklungsplans haben Sie im Frühjahr 2025 zählen
        lassen. Ich bitte um diese Zählungen.
    links:
      - ["Verkehrszählung in Finsterwalde (2025)", "https://www.finsterwalde.de/Politik-Verwaltung/Aktuelles/Nachrichten/Verkehrsz%C3%A4hlung-in-Finsterwalde-Wichtige-Daten-f%C3%BCr-die-Zukunft-der-Mobilit%C3%A4t.php?ModID=255&FID=3652.3871.1"]
- ags: "12065036"
  name: Birkenwerder
  lage: [13.2828, 52.6885]
  kontakt: {fds_suche: "Gemeinde Birkenwerder"}
  kurzzeit:
    stand: kandidat
    was: >-
      eigene Verkehrszählgeräte der Gemeinde; Zählungen für das interkommunale Verkehrskonzept der
      vier S-Bahn-Gemeinden
    situation: >-
      Die Gemeinde misst mit eigenen Zählgeräten das Verkehrsaufkommen in einzelnen Straßen. Für das
      interkommunale Verkehrskonzept mit Glienicke/Nordbahn, Mühlenbecker Land und Hohen Neuendorf
      wurde zudem umfangreich gezählt und befragt. Ergebnisse sind nicht veröffentlicht.
    empfehlung: >-
      Anfrage nach den Exporten der eigenen Zählgeräte und den Zählungen für das Verkehrskonzept,
      mit Lizenz. Grundlage: Akteneinsichts- und Informationszugangsgesetz.
    weg: "FragDenStaat, AIG Brandenburg"
    anfrage:
      an: "Gemeinde Birkenwerder"
      zusatz: >-
        Ich bitte um die Exporte Ihrer Verkehrszählgeräte und um die Zählungen für das
        interkommunale Verkehrskonzept der vier S-Bahn-Gemeinden.
    links:
      - ["Verkehrszählungen und Befragungen", "https://www.birkenwerder.de/rathaus/aktuelles/neuigkeiten/details/verkehrszaehlungen-und-befragungen-1"]
      - ["Verkehrszählgeräte der Gemeinde", "https://www.birkenwerder.de/rathaus/aktuelles/neuigkeiten/details/verkehrszaehlgeraete-der-gemeinde-entwendet"]
