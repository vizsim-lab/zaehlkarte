- ags: "07335022"
  name: Landstuhl
  lage: [7.5688, 49.4102]
  kontakt: {fds_suche: "Verbandsgemeinde Landstuhl"}
  kurzzeit:
    stand: ohne_lizenz
    was: >-
      Begleituntersuchung zum Verkehrsversuch Kaiserstraße (R+T, 2022, PDF): Knotenstromzählungen
      an sechs Knoten vom 15.05.2018 und 17.02.2022, Kfz und Schwerverkehr als Summe 6–10 und
      15–19 Uhr; ohne Lizenz, mit Urheberrechtsvermerk des Büros
    situation: >-
      Für den Verkehrsversuch in der Kaiserstraße hat die Verbandsgemeindeverwaltung das Büro R+T
      Verkehrsplanung an sechs Knotenpunkten zählen lassen, vorher am 15. Mai 2018 und während des
      Versuchs am 17. Februar 2022. Der Bericht vom 14. April 2022 steht als PDF auf landstuhl.de:
      Kfz und Schwerverkehr je Knotenarm und Fahrbeziehung, aber nur als Summe der Stundengruppen
      6–10 und 15–19 Uhr („Kfz/8h“); gezählt zeigt sie nur Plan 1, für den Vergleich sind alle
      Werte von 2022 mit einem Faktor von 11 % korrigiert. Eine Lizenz nennt der Bericht nicht;
      Texte, Fotos und Grafiken stehen unter dem Urheberrecht des Büros. Werte je Stunde enthält er
      nicht.
    empfehlung: >-
      Anfrage nach den Zählungen 2018 und 2022 je Stunde (oder Viertelstunde), Knotenpunkt und
      Fahrbeziehung, wie sie das Büro geliefert hat, mit Lizenz. Grundlage: Landestransparenzgesetz.
    weg: "FragDenStaat, LTranspG RP"
    anfrage:
      an: "Verbandsgemeindeverwaltung Landstuhl"
      zusatz: >-
        Für den Verkehrsversuch Kaiserstraße hat R+T Verkehrsplanung am 15.05.2018 und am 17.02.2022
        an Knotenpunkten gezählt (Begleituntersuchung vom 14.04.2022). Ich bitte vor allem um diese
        Zählungen mit den Werten je Intervall, Knotenpunkt und Fahrbeziehung.
    links:
      - ["Begleituntersuchung Verkehrsversuch Kaiserstraße (2022)", "https://www.landstuhl.de/verbandsgemeinde-landstuhl/die-verbandsgemeinde/die-ortsgemeinden/sickingenstadt-landstuhl/stadt/projekte/2022-04-14-rt-verkehrsversuch-landstuhl-gesamtbericht.pdf?cid=152m"]
