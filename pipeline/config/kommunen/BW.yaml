# Freiburg, Karlsruhe, Ettlingen: Recherche November 2026 (GovData/daten.bw, Portale der Städte,
# FragDenStaat-Volltextsuche; Werkzeug-Branch werkzeug/erkundung, ergebnis/bw2).
- ags: "08311000"
  name: Freiburg im Breisgau
  lage: [7.8499, 47.9948]
  kontakt: {name: "Stadt Freiburg im Breisgau", email: "buergerberatung@stadt.freiburg.de", fds: "https://fragdenstaat.de/behoerde/9204/stadt-freiburg-im-breisgau/"}
  kurzzeit:
    stand: nichts_offen
    was: >-
      offen nur automatische Zählungen: Rad-Zählstellen (Stundenwerte seit 2015), dazu 25
      Verkehrssensoren im Testbetrieb; Knotenpunkt- und Querschnittszählungen nicht online
    situation: >-
      Offen sind die Stundenwerte der Rad-Zählstellen seit 2015 (FR.ITZ, Datenlizenz Deutschland –
      Namensnennung 2.0). Dazu zählen Sensoren dauerhaft an 25 Standorten in beiden Richtungen nach
      zehn Fahrzeugklassen in 15-Minuten-Intervallen; laut Stadt (Juli 2025) noch im Testbetrieb, die
      Daten sollen danach kostenlos ins Geoportal – der Dienst dort zeigt bisher nur drei Standorte
      mit Werten vom Mai 2024. Die Rad-Zählstellen stehen als Dauerzählstellen in der Karte (über
      MobiData BW), die Sensoren noch nicht. Die
      Stadtradeln-Auswertungen sind GPS-Spuren aus der App, keine Zählungen. Kurzzeitzählungen
      der Stadt kommen nur in Gutachten vor, ohne Zählwerte – etwa stundenweise Rad- und
      Fußzählungen im Mai bis Juli 2022 für die Verkehrsuntersuchung Schlossbergring.
    empfehlung: >-
      Anfrage nach den Knotenpunkt- und Querschnittszählungen des Garten- und Tiefbauamts, auch
      nach denen, die für Verkehrsuntersuchungen erhoben wurden. Grundlage:
      Landesinformationsfreiheitsgesetz Baden-Württemberg.
    weg: "FragDenStaat, LIFG BW"
    anfrage:
      zusatz: >-
        Gemeint sind die Kurzzeitzählungen an Knotenpunkten und Querschnitten, auch die für
        Verkehrsuntersuchungen erhobenen (etwa die Stichprobenzählungen im Mai bis Juli 2022 zur
        Verkehrsuntersuchung Schlossbergring) – nicht die Rad-Zählstellen und die Verkehrssensoren.
    links:
      - ["FR.ITZ: Fahrrad-Zählstellen", "https://fritz.freiburg.de/duva2dcat/dataset/de-bw-freiburg-fahrrad-zaehlstellen_zeitreihe.html"]
      - ["Meldung Sensoren (24.7.2025)", "https://digital.freiburg.de/neuigkeiten/detail/moderne-verkehrszaehlung-in-freiburg"]
      - ["Geoportal: Verkehrssensoren (WFS)", "https://geoportal.freiburg.de/wfs/digit_verkehrszaehl/digit_verkehrszaehl?REQUEST=GetCapabilities&SERVICE=WFS"]
      - ["VU Schlossbergring 2023 (PDF)", "https://www.freiburg.de/pb/site/Freiburg/get/params_E-138366714/2151489/231205_Bericht_VU%20Schlossberring.pdf"]
  dauer:
    stand: in_karte
    quellen: [mobidata_rad]
    was: >-
      Rad-Zählstellen (Eco-Counter) über MobiData BW in der Karte; 25 Verkehrssensoren noch im
      Testbetrieb (im Geoportal bisher nur Werte vom Mai 2024) – nicht in der Karte
    links:
      - ["MobiData BW: Rad-Zählstellen (Eco-Counter)", "https://mobidata-bw.de/dataset/eco-counter-fahrradzahler"]
      - ["FR.ITZ: Fahrrad-Zählstellen", "https://fritz.freiburg.de/duva2dcat/dataset/de-bw-freiburg-fahrrad-zaehlstellen_zeitreihe.html"]
      - ["Meldung Sensoren (24.7.2025)", "https://digital.freiburg.de/neuigkeiten/detail/moderne-verkehrszaehlung-in-freiburg"]
      - ["Geoportal: Verkehrssensoren (WFS)", "https://geoportal.freiburg.de/wfs/digit_verkehrszaehl/digit_verkehrszaehl?REQUEST=GetCapabilities&SERVICE=WFS"]
