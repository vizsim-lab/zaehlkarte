      fünf Zählkameras seit Juli 2024, je Verkehrsteilnehmer eine Zeile, Standorte nur als Kürzel;
      dazu eine Rad-Dauerzählstelle; Kurzzeitzählungen nicht online
    situation: >-
      Im Datenhub der Stadt stehen die Zählungen von fünf Kameras aus dem Projekt „VGV Ulm“ seit
      Juli 2024: je erkanntem Verkehrsteilnehmer Zeitpunkt, Klasse (etwa Pkw, Fußgänger) und
      Richtung, Lizenz „Andere (Namensnennung)“. Die Standorte stehen nur als Kürzel dabei (etwa
      „Cam-1-01“); zwei Kameras liefen im Oktober 2026 noch, in der Karte sind sie nicht. Die
      Rad-Dauerzählstelle am Blautalradweg (Lupferbrücke) steht über MobiData BW als Dauerzählstelle
      in der Karte. Knotenpunkt- und Querschnittszählungen stehen nicht online.
    empfehlung: >-
      Anfrage nach den Knotenpunkt- und Querschnittszählungen und nach den Standorten der Kameras.
      Grundlage: Landesinformationsfreiheitsgesetz Baden-Württemberg.
    weg: "FragDenStaat, LIFG BW"
    anfrage:
      zusatz: >-
        Zu den Kamerazählungen im Datenhub (Datensatz „vgv_ulm“) bitte ich nur um die Standorte der
        Kameras (Koordinaten zu den Kürzeln wie „Cam-1-01“) und ihre Zählzeiträume.
    links:
      - ["Datenhub Ulm: vgv_ulm", "https://datenhub.ulm.de/ckan/dataset/vgv_ulm"]
      - ["Datenhub Ulm: Fahrradzählstelle", "https://datenhub.ulm.de/ckan/dataset/fahrradzahler_lupferbruecke"]
  dauer:
