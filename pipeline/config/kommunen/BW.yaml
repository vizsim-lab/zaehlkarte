    was: >-
      mobile Zählungen 2020 an sechs Stellen (Rad, zu Fuß, an zwei Stellen Kfz), 5- oder
      15-Minuten-Werte über ein bis sechs Wochen
    situation: >-
      Die Stadt veröffentlicht ihre mobilen Zählungen von 2020 offen (CC0): je Standort eine CSV
      mit 5- oder 15-Minuten-Werten je Richtung – Rad, zu Fuß und an zwei Stellen Kfz. Die Lage
      steht nur als Straße, Brücke oder Hausnummer dabei; die Karte setzt sie aus OpenStreetMap.
      Zählungen nach 2020 enthält der Datensatz nicht; die Fahrrad-Dauerzählstellen der Stadt
      stehen als Dauerzählstellen in der Karte (über MobiData BW).
    empfehlung: >-
      Für mobile Zählungen ab 2021, Knotenpunkt- und Querschnittszählungen des Kfz-Verkehrs und
      die genaue Lage der Geräte lohnt eine Anfrage nach dem Landesinformationsfreiheitsgesetz
      Baden-Württemberg.
    weg: "offen; ergänzend FragDenStaat, LIFG BW"
    anfrage:
      zusatz: >-
        Auf Ihrem Open-Data-Portal stehen die mobilen Zählungen des Rad- und Fußverkehrs von 2020.
        Ich bitte zusätzlich um die mobilen Zählungen ab 2021, um die Knotenpunkt- und
        Querschnittszählungen des Kfz-Verkehrs und um die genaue Lage der Zählgeräte (Koordinaten).
    links:
      - ["Offene Daten Konstanz", "https://offenedaten-konstanz.de/dataset/mobile-verkehrsz-hlungen-rad-und-fu-verkehr"]
  dauer:
    stand: in_karte
    quellen: [mobidata_rad]
