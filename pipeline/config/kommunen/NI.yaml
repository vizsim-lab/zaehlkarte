    was: >-
      nutzt seit April 2026 dieselbe Zählsoftware wie München (DAVe)
    situation: >-
      Nutzt seit April 2026 dieselbe Zählsoftware wie München (DAVe). Wie viele Zählungen es gibt,
      ist nicht bekannt.
    empfehlung: >-
      Anfrage nach einem DAVe-Export und den älteren Zählungen. Niedersachsen hat kein Landes-IFG:
