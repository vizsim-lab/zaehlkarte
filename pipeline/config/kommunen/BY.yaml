- ags: "09761000"
  name: Augsburg
  lage: [10.8978, 48.3689]
  kontakt: {fds_suche: "Stadt Augsburg"}
  kurzzeit:
    stand: geliefert
    was: >-
      2017 auf Anfrage eine Karte der jüngsten Zählung je Zählstelle (Kfz/24 h am Werktag,
      Lkw-Anteil, Jahr) und eine Liste der Zählstellen mit Koordinaten; Stundenwerte nur gegen
      Aufbereitung
    situation: >-
      Auf eine Anfrage 2017 hat die Stadt eine Karte mit der jeweils jüngsten Zählung je Zählstelle
      geschickt (Kfz in 24 Stunden an einem durchschnittlichen Werktag, Lkw-Anteil, Zähljahr) und
      eine Excel-Liste der neueren Zählstellen mit Koordinaten; gezählt wird meist an Kreuzungen. Die
      stündlichen Zählungen seien nicht geokodiert und ohne Erläuterung schwer verständlich; ihre
      Aufbereitung würde Wochen dauern und koste Gebühren.
    empfehlung: >-
      Anfrage nach den stündlichen Zählungen in der Form, in der sie vorliegen – die Zuordnung zu den
      Zählstellen erlaubt die Liste von 2017. Bayern hat kein Landes-IFG: Grundlage ist das
      Bayerische Umweltinformationsgesetz.
    weg: "FragDenStaat, Bayerisches UIG"
    anfrage:
      zusatz: >-
        2017 haben Sie auf eine Anfrage eine Karte der jüngsten Zählungen und eine Liste der
        Zählstellen mit Koordinaten geschickt. Ich bitte um die Zählungen selbst (Stunden- oder
        Viertelstundenwerte) in der Form, in der sie bei Ihnen vorliegen; eine Aufbereitung ist nicht
        nötig.
    links:
      - ["FragDenStaat 2017", "https://fragdenstaat.de/anfrage/orte-und-messwerte-der-zahlstellen-zum-verkehrsaufkommen/"]
  dauer:
    stand: in_karte
    quellen: [augsburg_fuss, augsburg_rad]
    was: >-
      Passantenzählung in der Annastraße: Stundenwerte seit Dezember 2020 (CC BY 4.0), in der Karte
      unter Fuß; zwölf Radzählstationen: nur Tageswerte seit September 2016 (CC BY 4.0), in der
      Karte als Tageswerte der Quelle (ohne Stunden, Vollständigkeit nicht prüfbar) – beide seit
      November 2026
    links:
      - ["Radzählstationen (Stadt Augsburg)", "https://www.augsburg.de/buergerservice-rathaus/verkehr/radverkehr/radzaehlstationen"]
      - ["Mobilithek: Radzählstationen", "https://mobilithek.info/offers/-4859503742463304999"]
      - ["Mobilithek: Passanten Annastraße", "https://mobilithek.info/offers/-1747083335311792689"]
