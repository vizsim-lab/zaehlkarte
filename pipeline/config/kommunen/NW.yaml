- ags: "05515000"
  name: Münster
  lage: [7.62953, 51.95558]
  kontakt: {fds_suche: "Stadt Münster"}
  kurzzeit:
    stand: in_karte
    quellen: [muenster]
    was: >-
      rund 1.160 Kfz-Knotenpunktzählungen 2000–2020 (XLS und PDF), je meist zwei Stunden (7–8 und
      16–17 Uhr)
    situation: >-
      Die Stadt veröffentlicht ihre manuellen Kfz-Zählungen offen (dl-de/by-2-0): ein ZIP mit
      einer Datei je Zählung – XLS 2000–2012 und PDF 2010–2020, beide in der Karte (außer Scans
      und Radar-Berichten ohne Knotenstromplan) – und die Lage der Knoten als CSV. Je Zählung
      stehen nur die Spitzenstunden (meist 7–8 und 16–17 Uhr) nach Fahrzeugart. Die Spalte
      „Rad“ ist keine vollständige Radzählung; Zählungen ab 2021 fehlen.
    empfehlung: >-
      Für ganze Zählfenster, Zählungen ab 2021 und die Frage, was die Rad-Spalte erfasst, lohnt
      eine Anfrage nach dem IFG NRW.
    weg: "offen; ergänzend FragDenStaat, IFG NRW"
    anfrage:
      zusatz: >-
        Auf Ihrem Open-Data-Portal stehen die manuellen Verkehrszählungen bis 2020 mit den
        Spitzenstunden. Ich bitte zusätzlich um die Zählungen ab 2021, um die Werte aller gezählten
        Intervalle (nicht nur der Spitzenstunden) und um eine kurze Erläuterung, ob die Spalte „Rad“
        alle Radfahrenden am Knoten erfasst oder nur die auf der Fahrbahn.
    links:
      - ["Open Data Münster", "https://opendata.stadt-muenster.de/dataset/verkehrsz%C3%A4hlung-manuelle-verkehrserhebung"]
      - ["Nutzungsbedingungen", "https://opendata.stadt-muenster.de/nutzungsbedingungen"]
      - ["stadt-muenster.de", "https://www.stadt-muenster.de/verkehrsplanung/verkehr-in-zahlen/kfz-verkehrszaehlungen"]
  dauer:
    stand: in_karte
    quellen: [muenster_rad]
    was: >-
      Rad-Zählstellen der Stadt: 15-Minuten-Werte seit 2019, nächtlich aktualisiert, in der Karte
      als Dauerzählstellen
    links:
      - ["GitHub: od-ms/radverkehr-zaehlstellen", "https://github.com/od-ms/radverkehr-zaehlstellen"]
      - ["Open Data Münster: Fahrradverkehr, tagesaktuelle Daten", "https://opendata.stadt-muenster.de/dataset/verkehrsz%C3%A4hlung-fahrradverkehr-tagesaktuelle-daten"]
