    quellen: [hamburg_kfz, hamburg_rad]
    was: >-
      Wärmebildkameras an über 400 Kreuzungen: Stundenwerte je Zählstelle für Kfz,
      Schwerverkehr und Rad, für Kfz und Rad davor Tageswerte seit 2020, über die SensorThings API
      (dl-de/by-2-0), in der Karte als Dauerzählstellen
    links:
