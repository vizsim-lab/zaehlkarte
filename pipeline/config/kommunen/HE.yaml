- ags: "06412000"
  name: Frankfurt am Main
  lage: [8.6821, 50.1109]
  kontakt: {fds_suche: "Frankfurt am Main Verkehr"}
  kurzzeit:
    stand: aggregiert
    was: >-
      24-Stunden-Mittelwerte 2019–2023 als WFS, auch für Rad – in vizsim/svz; Einzelzählungen
      laut Stadt auf Anfrage
    situation: >-
      Offen sind 24-Stunden-Mittelwerte 2019–2023 je Straßenabschnitt als WFS (Kfz, Rad, Lkw mit
      und ohne Anhänger; Datenlizenz Deutschland – Namensnennung 2.0). Laut Antwort des Referats
      Mobilitäts- und Verkehrsplanung auf eine Anfrage 2018 zählt die Stadt Fuß-, Rad- und
      Kfz-Verkehr im ganzen Stadtgebiet, aber nur bei Bedarf und nicht regelmäßig, und stellt
      vorliegende Verkehrsmengen „jedem Interessenten auf Anfrage gerne zur Verfügung“.
    empfehlung: >-
      Anfrage nach den Einzelzählungen hinter den Mittelwerten (seit 2015, je Zählung Werte je
      Intervall und Richtung) samt Lizenz – die Stadt hat 2018 Herausgabe auf Anfrage zugesagt. Das
      hessische Informationsfreiheitsrecht gilt für Kommunen nur per Satzung – das Hessische
      Umweltinformationsgesetz gilt immer.
    weg: "FragDenStaat, Hessisches UIG"
    anfrage:
      zusatz: >-
        Offen sind 24-Stunden-Mittelwerte je Zählstelle (WFS „Verkehrsmengen“); ich bitte um die
        Einzelzählungen dahinter. 2018 hat das Referat Mobilitäts- und Verkehrsplanung geschrieben,
        vorliegende Verkehrsmengen stelle es jedem Interessenten auf Anfrage zur Verfügung.
    links:
      - ["WFS Verkehrsmengen (Open Data Hessen)", "https://opendata.hessen.de/dataset/wfs-verkehrsmengen-frankfurt-am-main"]
      - ["FragDenStaat 2018", "https://fragdenstaat.de/anfrage/verkehrsaufkommen-frankfurt-sachsenhausen/"]
  dauer:
    stand: kandidat
    was: >-
      zehn Rad-Dauerzählstellen des Landesnetzes (fünf an Standorten der Stadt, fünf von Hessen
      Mobil) und eine Zählsäule der Stadt – Werte nur im Zählportal des Landes, ohne
      Lizenzangabe; Detektordaten der Messstellen der Stadt über die Mobilithek nur nach Freigabe
      einer Subskription; dazu seit Oktober 2023 die Passantenfrequenz in acht Einkaufsstraßen auf
      der Urbanen Datenplattform (stündlich aktualisiert, mit der Wirtschaftsförderung), nicht als
      Daten veröffentlicht
    links:
      - ["Rad-Dauerzählstellen (radfahren-ffm.de)", "https://www.radfahren-ffm.de/703-0-Daten-fuer-die-Radverkehrsfoerderung.html"]
      - ["Zählportal des Landes", "https://hessen-mobil.eco-counter.com/"]
      - ["Detektordaten (Mobilithek)", "https://mobilithek.info/offers/110000000002386001"]
      - ["Passantenfrequenz auf der Urbanen Datenplattform (Newsletter Oktober 2023)", "https://frankfurt.de/-/media/frankfurtde/frankfurt-themen/digitalisierung/pdf/newsletter/2023/newsletter-oktober-2023.pdf"]
- ags: "06611000"
  name: Kassel
  lage: [9.4797, 51.3127]
  kontakt: {fds_suche: "Stadt Kassel"}
  kurzzeit:
    stand: ohne_lizenz
    was: >-
      2021 auf Anfrage fünf 24-Stunden-Knotenstromzählungen (2018–2020), vier als Excel mit allen
      Verkehrsarten in 15-Minuten-Werten; offen nur Verkehrsmengenkarten 2022–2024
    situation: >-
      Die Stadt zählt laut ihrer Antwort von 2021 auf vier Arten: Dauerzählstellen mit
      Induktionsschleifen, Kurzzeitzählungen mit Seitenradar und mit Dialog-Displays an wechselnden
      Orten und Knotenstromzählungen über einen Tag an wechselnden Kreuzungen. Auf eine Anfrage 2021
      kamen fünf Knotenstromzählungen 2018–2020 (24 Stunden an Werktagen), vier davon als Excel mit
      allen gezählten Verkehrsarten in 15-Minuten-Intervallen, eine als PDF-Tabellenbericht, dazu
      Grafiken des Radverkehrs – ohne Lizenzangabe, daher nicht in der Karte. Offen sind sonst nur
      die Verkehrsmengenkarten 2022, 2023 und 2024 als PDF (Kfz je Richtung, Mittel Mo–Fr) aus den
      Dauerzählstellen.
    empfehlung: >-
      Anfrage nach allen Knotenstrom- und Seitenradarzählungen seit 2015 in derselben Form (Excel)
      samt Lizenz. Kassel hat eine Informationsfreiheitssatzung (so der Hessische Beauftragte für
      Datenschutz und Informationsfreiheit 2020 in einer Antwort auf FragDenStaat), also gilt das
      HDSIG; das Hessische Umweltinformationsgesetz gilt ohnehin.
    weg: "FragDenStaat, HDSIG (Satzung) und Hessisches UIG"
    anfrage:
      zusatz: >-
        2021 haben Sie auf eine Anfrage Knotenstromzählungen als Excel-Tabellenbericht mit
        15-Minuten-Werten aller Verkehrsarten geschickt. Ich bitte um alle Knotenstrom- und
        Seitenradarzählungen seit 2015 in derselben Form.
    links:
      - ["kassel.de", "https://www.kassel.de/buerger/verkehr_und_mobilitaet/verkehrsprojekte/verkehrszaehlungen.php"]
      - ["FragDenStaat 2021", "https://fragdenstaat.de/anfrage/ifg-anfrage-radverkehrszahlung/"]
      - ["Satzung laut HBDI (FragDenStaat 2020)", "https://fragdenstaat.de/anfrage/automatisierte-verkehrszahlungen-in-rosbach-vdhohe-1/"]
  dauer:
    stand: kandidat
    was: >-
      Dauerzählstellen mit Induktionsschleifen; offen nur die Verkehrsmengenkarten 2022–2024 als
      PDF (Mittel Mo–Fr), nicht die Zählwerte; Detektordaten über die Mobilithek nur nach Freigabe
      einer Subskription
    links:
      - ["kassel.de", "https://www.kassel.de/buerger/verkehr_und_mobilitaet/verkehrsprojekte/verkehrszaehlungen.php"]
      - ["FragDenStaat 2021", "https://fragdenstaat.de/anfrage/ifg-anfrage-radverkehrszahlung/"]
      - ["Detektordaten (Mobilithek)", "https://mobilithek.info/offers/110000000002398000"]
- ags: "06411000"
  name: Darmstadt
  lage: [8.65, 49.8667]
  kontakt: {fds_suche: "Stadt Darmstadt"}
