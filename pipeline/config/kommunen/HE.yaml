    situation: >-
      Die Stadt stellt die Rohdaten ihres Verkehrsleitrechners offen bereit: je Kreuzung Monatsdateien
      (CSV) mit Minutenwerten jeder Induktionsschleife, ungeprüft, seit 2022 (Datenlizenz Deutschland
