      Anfrage nach den Kurzzeitzählungen (Knotenpunkte, Querschnitte, Rad) seit 2015. Das hessische
      Informationsfreiheitsrecht gilt für Kommunen nur per Satzung – das Hessische
      Umweltinformationsgesetz gilt immer.
    weg: "FragDenStaat, Hessisches UIG"
    anfrage:
      zusatz: >-
        Die Rohdaten Ihres Verkehrsleitrechners stehen bereits offen bereit (opendata.darmstadt.de);
        mir geht es um die Zählungen an Knotenpunkten und Querschnitten, auch des Radverkehrs.
    links:
      - ["Verkehrsdaten im Rohformat 2025", "https://opendata.darmstadt.de/dataset/verkehrsdaten-im-rohformat-2025"]
      - ["FragDenStaat 2024", "https://fragdenstaat.de/anfrage/verkehrsanalyse-der-hauptverkehrsstrassen-differenzierung-nach-verkehrsarten/"]
  dauer:
    stand: offen
    was: >-
      Rohdaten des Verkehrsleitrechners: je Ampelkreuzung Minutenwerte jeder Induktionsschleife
      (Zählwert und Belegung) seit 2022, Datenlizenz Deutschland – Namensnennung 2.0; welche
      Schleife auf welcher Spur liegt, zeigen nur die Kreuzungspläne (PDF) – noch nicht in der Karte
    links:
      - ["Verkehrsdaten im Rohformat 2025", "https://opendata.darmstadt.de/dataset/verkehrsdaten-im-rohformat-2025"]
      - ["Kreuzungspläne", "https://opendata.darmstadt.de/dataset/kreuzungspl%C3%A4ne-stadt-darmstadt"]
