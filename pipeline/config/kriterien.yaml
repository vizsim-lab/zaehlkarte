# Schulweg-Kriterium – eigene Heuristik, keine amtliche Definition (die VwV-StVO nennt
# keine Zahl). Voreinstellung der Karte; dort lässt sich alles per Regler ändern. Die
# Pipeline nutzt dieselben Werte für Statistik und CSV-Export (manifest.json trägt sie mit).
#
# Eine Zählung hat Schulweg-Verdacht, wenn in einer der Schulstunden mehr als
# `schwelle_stunde` Kinder/Jugendliche gezählt wurden ODER zwischen `tag_von` und `tag_bis`
# Uhr mehr als `schwelle_tag` (jeweils alle Richtungen zusammen).

schulstunden: [7, 8, 13, 14, 15]  # Stunde ab hh:00
schwelle_stunde: 50
schwelle_tag: 300
tag_von: 7   # Tagessumme nur, wenn 7–19 Uhr vollständig gezählt ist
tag_bis: 19
