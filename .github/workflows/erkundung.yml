# Entwicklungswerkzeug: Open-Data-Portale und Gemeindeseiten nach Verkehrszählungen durchsuchen
# (tools/*.py) und das Ergebnis in denselben Branch legen (Pushes mit GITHUB_TOKEN starten keinen
# neuen Lauf). Teile: portale, webseiten (tools/hessen.py), lesen (tools/hessen2.py).
name: Erkundung Zähldaten
on:
  push:
    branches: [werkzeug/erkundung]
    paths: [tools/**, .github/workflows/erkundung.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  erkunden:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        teil: [nrw2_mdk]
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y -qq poppler-utils > /dev/null
      - run: |
          case "${{ matrix.teil }}" in
            lesen) timeout 52m python3 tools/hessen2.py ergebnis/hessen2 || true ;;
            lesen3) timeout 52m python3 tools/hessen2.py ergebnis/hessen3 tools/hessen3_seiten.txt nur_seiten || true ;;
            lesen4) timeout 52m python3 tools/hessen2.py ergebnis/hessen4 tools/hessen4_seiten.txt nur_seiten || true ;;
            lizenz5) timeout 20m python3 tools/hessen5.py || true ;;
            nrw2_mdk) timeout 30m python3 tools/nrw2.py ergebnis/nrw2_mdk tools/nrw2_seiten.txt mdk || true ;;
            nrw2) timeout 52m python3 tools/nrw2.py ergebnis/nrw2 tools/nrw2_seiten.txt || true ;;
            nw_*) t="${{ matrix.teil }}"; timeout 52m python3 tools/land.py ergebnis/nrw "${t#nw_}" NW || true ;;
            *) timeout 52m python3 tools/hessen.py ergebnis/hessen ${{ matrix.teil }} || true ;;
          esac
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ergebnis
          git commit -q -m "Erkundung $(date -u +%F) ${{ matrix.teil }}" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin werkzeug/erkundung && git push -q origin HEAD:werkzeug/erkundung && break
            sleep $((RANDOM % 15 + 5))
          done
