# Entwicklungswerkzeug: Open-Data-Portale und Gemeindeseiten nach Verkehrszählungen durchsuchen
# (tools/*.py) und das Ergebnis in denselben Branch legen (Pushes mit GITHUB_TOKEN starten keinen
# neuen Lauf). Teile: portale, webseiten (tools/hessen.py), lesen (tools/hessen2.py);
# Runde 3 (r3_<LAND>): tools/land.py + tools/land_lesen.py, mobilithek: tools/mobilithek_alle.py.
name: Erkundung Zähldaten
on:
  push:
    branches: [werkzeug/erkundung]
    paths: [tools/**, .github/workflows/erkundung.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  erkunden:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        teil: [gezielt2]
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y -qq poppler-utils > /dev/null
      - uses: astral-sh/setup-uv@v10.1.0
      - run: |
          case "${{ matrix.teil }}" in
            lesen) timeout 52m python3 tools/hessen2.py ergebnis/hessen2 || true ;;
            lesen3) timeout 52m python3 tools/hessen2.py ergebnis/hessen3 tools/hessen3_seiten.txt nur_seiten || true ;;
            lesen4) timeout 52m python3 tools/hessen2.py ergebnis/hessen4 tools/hessen4_seiten.txt nur_seiten || true ;;
            lizenz5) timeout 20m python3 tools/hessen5.py || true ;;
            nrw4) timeout 40m python3 tools/nrw2.py ergebnis/nrw4 tools/nrw4_seiten.txt nachpruefen,seiten || true ;;
            wege) timeout 20m python3 tools/wege.py ergebnis/wege || true ;;
            wege2) timeout 20m python3 tools/wege2.py ergebnis/wege2 || true ;;
            wege2b) timeout 20m python3 tools/wege2.py ergebnis/wege2 20 || true ;;
            overpass_probe) timeout 15m python3 tools/overpass_probe.py ergebnis/overpass_probe || true ;;
            kmk_pdf) timeout 10m python3 tools/kmk_pdf.py ergebnis/ferien || true ;;
            ags) timeout 20m python3 tools/ags.py ergebnis/ags || true ;;
            gezielt*) timeout 40m python3 tools/gezielt_lesen.py "ergebnis/runde3/${{ matrix.teil }}" "tools/r3_gezielt_${{ matrix.teil }}.txt" || true ;;
            mobilithek) timeout 20m python3 tools/mobilithek_alle.py ergebnis/runde3 || true ;;
            angebote) timeout 10m python3 tools/mobilithek_angebote.py ergebnis/runde3/angebote -3266808188115042159 903287344194932736 -4859503742463304999 -1747083335311792689 -8264466313321172654 -7110458871198256509 922430355709591552 973579563426357248 837297127089401856 110000000003145002 || true ;;
            r3_*)
              l="${{ matrix.teil }}"; l="${l#r3_}"
              # Overpass-Abfragen der Länder zeitlich verteilen
              sleep "$(python3 -c "import sys; print('NI BY BW RP SH SN ST TH BB MV SL HH HB BE'.split().index(sys.argv[1]) * 40)" "$l")"
              timeout 75m python3 tools/land.py "ergebnis/runde3b/$l" webseiten,osm "$l" || true
              timeout 55m python3 tools/land_lesen.py "ergebnis/runde3b/$l" 50 || true ;;
            pipeline_probe)
              git fetch -q origin robots-pipeline && git worktree add -q ../zk FETCH_HEAD
              (cd ../zk/pipeline && uv sync --locked -q && timeout 45m uv run python "$GITHUB_WORKSPACE/tools/pipeline_probe.py" "$GITHUB_WORKSPACE/ergebnis/pipeline_probe") || true ;;
            robots_audit) timeout 20m python3 tools/robots_audit.py || true ;;
            nrw3) timeout 52m python3 tools/nrw2.py ergebnis/nrw3 tools/nrw3_seiten.txt robots,mdk,seiten || true ;;
            nrw2_mdk) timeout 30m python3 tools/nrw2.py ergebnis/nrw2_mdk tools/nrw2_seiten.txt mdk || true ;;
            nrw2) timeout 52m python3 tools/nrw2.py ergebnis/nrw2 tools/nrw2_seiten.txt || true ;;
            nw_*) t="${{ matrix.teil }}"; timeout 52m python3 tools/land.py ergebnis/nrw "${t#nw_}" NW || true ;;
            *) timeout 52m python3 tools/hessen.py ergebnis/hessen ${{ matrix.teil }} || true ;;
          esac
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ergebnis
          git commit -q -m "Erkundung $(date -u +%F) ${{ matrix.teil }}" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin werkzeug/erkundung && git push -q origin HEAD:werkzeug/erkundung && break
            sleep $((RANDOM % 15 + 5))
          done
