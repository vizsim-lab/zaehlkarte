# Entwicklungswerkzeug: Open-Data-Portale und Gemeindeseiten nach Verkehrszählungen durchsuchen
# (tools/*.py) und das Ergebnis in denselben Branch legen (Pushes mit GITHUB_TOKEN starten keinen
# neuen Lauf).
name: Erkundung Zähldaten
on:
  push:
    branches: [werkzeug/erkundung]
    paths: [tools/**, .github/workflows/erkundung.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  erkunden:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        teil: [portale, webseiten]
    steps:
      - uses: actions/checkout@v7
      - run: timeout 52m python3 tools/hessen.py ergebnis/hessen ${{ matrix.teil }} || true
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ergebnis
          git commit -q -m "Erkundung $(date -u +%F) Hessen ${{ matrix.teil }}" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin werkzeug/erkundung && git push -q origin HEAD:werkzeug/erkundung && break
            sleep $((RANDOM % 15 + 5))
          done
