# Entwicklungswerkzeug: Quellen erkunden oder Dauerzählstellen mit dem Code eines App-Branches
# bauen (Berlin- und Hamburg-Quellen sind aus manchen Entwicklungsumgebungen nicht erreichbar).
# Was ein Lauf tut, steht in tools/lauf.sh; Ergebnisse landen in ergebnis/ (Pushes mit
# GITHUB_TOKEN starten keinen neuen Lauf).
name: Erkundung Dauerzählstellen
on:
  push:
    branches: [werkzeug/dauer]
    paths: [tools/**, .github/workflows/erkundung-dauer.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120  # ein voller Bau mit Hamburg braucht knapp eine Stunde
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Lauf (tools/lauf.sh)
        run: bash tools/lauf.sh
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ergebnis
          git commit -q -m "Werkzeug-Lauf $(date -u +%FT%H:%MZ)" && git push origin HEAD:werkzeug/dauer
