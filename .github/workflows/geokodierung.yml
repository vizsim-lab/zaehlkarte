# Berliner Zählungen ohne Lage (vor allem Kfz vor 2021) geokodieren: Liste aus der Pipeline,
# Geocoder aus vizsim/berlin-traffic-counts_schulwege (gepinnt wie die Rohdaten), OSM-Abzug
# von Geofabrik. Ergebnis: pipeline/geokodierung/berlin_ergaenzung.csv als Pull Request
# (darf Actions keine PRs anlegen, bleibt der Branch stehen – Link in der Zusammenfassung).
#
# Geofabrik sperrt `*.osm.pbf` per robots.txt für alle Robots. Der Abzug geht darum über die
# Pipeline (`zaehlkarte lade`, robots.txt) mit der Ausnahme an der Quelle `berlin` in
# sources.yaml (Beschluss vom 14.11.2026) – und möglichst nur einmal: Er bleibt im Actions-Cache,
# ein weiterer Lauf nimmt ihn von dort (Straßen ändern sich selten; neu laden: Schlüssel erhöhen).
# GitHub löscht Caches, die sieben Tage niemand genutzt hat – dann lädt der nächste Lauf neu.
# Läuft nur von Hand – das Ergebnis liegt im Git und wird selten gebraucht.
name: Berlin geokodieren

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  geokodieren:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: vizsim/berlin-traffic-counts_schulwege
          ref: d09e6f06aaa84dd339a6e9ea91dfbf25b642c1a0
          path: schulwege
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Liste der Zählungen ohne Lage
        working-directory: pipeline
        run: |
          uv sync --locked
          uv run zaehlkarte fetch --quelle berlin
          uv run zaehlkarte geokodier-liste "$RUNNER_TEMP/liste.csv"
      - uses: actions/cache@v6  # OSM-Abzug: einmal laden, dann behalten
        with:
          path: pipeline/data/raw/osm
          key: osm-berlin-1
      - name: OSM-Abzug Berlin (Geofabrik, ODbL)
        working-directory: pipeline
        run: |
          ziel=data/raw/osm/berlin-latest.osm.pbf
          test -f "$ziel" || uv run zaehlkarte lade https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf "$ziel"
          ls -l "$ziel"
      - name: Geokodieren
        working-directory: schulwege/pipeline
        run: |
          uv sync --locked
          uv run python "$GITHUB_WORKSPACE/pipeline/werkzeuge/geokodiere_berlin.py" \
            "$RUNNER_TEMP/liste.csv" "$GITHUB_WORKSPACE/pipeline/data/raw/osm/berlin-latest.osm.pbf" ../data/berlin_plz.gpkg \
            "$GITHUB_WORKSPACE/pipeline/geokodierung/berlin_ergaenzung.csv" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- pipeline/geokodierung; then
            echo "Keine Änderung." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          zweig="daten/geokodierung-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$zweig"
          git add pipeline/geokodierung
          git commit -q -m "Berlin: Geokodierung der Zählungen ohne Lage ($(date -u +%F))"
          git push -f origin "$zweig"
          if ! gh pr create --base main --head "$zweig" --title "Berlin: Geokodierung ergänzt ($(date -u +%F))" \
               --body "Erzeugt vom Workflow „Berlin geokodieren“. Danach \`zaehlkarte site\` (Workflow „Kartendaten neu bauen“)."; then
            echo "PR nicht angelegt – Branch: ${{ github.server_url }}/${{ github.repository }}/compare/main...$zweig" >> "$GITHUB_STEP_SUMMARY"
          fi
