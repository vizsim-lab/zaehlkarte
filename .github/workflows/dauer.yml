# Dauerzählstellen bauen: Rohdaten holen (Berlin: Archiv der Verkehrsdetektion; Hamburg:
# SensorThings API; Ettlingen: Datastore; Rad-Zählstellen von MobiData BW, Münster, Aachen, Berlin,
# München, Würzburg, Rhein-Kreis Neuss, Dortmund, Essen, Leipzig, Rostock, Bochum, Bonn und
# Düsseldorf), Kartendaten nach public/data/dauer/ schreiben und als Release-Asset
# „dauerzaehlstellen/dauer.tar.gz“ ablegen – nicht ins Git (zu groß, ändert sich laufend). Danach
# startet der Workflow die CI auf main neu: Der Deploy-Job holt das Asset und liefert es aus.
#
# Läuft wöchentlich (montags), von Hand und wenn sich Pipeline-Code oder dieser Workflow ändern.
# - Berlin: Rohdaten zwischen den Läufen im Actions-Cache; geladen wird nur, was sich laut
#   Prüfsumme (Content-MD5 des Archivs) geändert hat. Ebenso im Cache: die Monatsdateien von
#   MobiData BW (neu geholt werden fehlende und die jüngsten zwei) und die Dateien Münchens (neu
#   nur bei geänderter URL); Münster, Aachen und Berlin (Rad) holt jeder Lauf ganz neu – der Cache
#   hält den letzten Stand, falls ein Portal einmal nicht antwortet (sonst fiele der Bau aus).
#   Die Opendatasoft-Exporte (Würzburg, Neuss, Dortmund), Essens Quartale und Düsseldorfs
#   Jahresdateien nur bei Änderung; Bonns Jahresdateien holt jeder Lauf neu.
# - Jeder Abruf nur, wenn robots.txt ihn erlaubt, mit dem verlangten Abstand (pipeline/src/
#   zaehlkarte/abruf.py; Aachen und München: 10 Sekunden). Ausnahmen nur aus sources.yaml
#   (`robots_ausnahme`) – der Bericht nennt jeden Abruf, der nur dank einer Ausnahme ging.
# - Der OSM-Abzug Hamburg (Geofabrik, für die Straßennamen neuer Stellen) wird nur geladen, wenn
#   neue Stellen ohne Namen auftauchen und keiner im Cache liegt, und dann behalten (neu laden:
#   Schlüssel `osm-hamburg-1` erhöhen). GitHub löscht Caches nach sieben Tagen ohne Zugriff; der
#   wöchentliche Lauf greift jedes Mal zu – fällt der Cache trotzdem weg, lädt erst die nächste
#   neue Stelle den Abzug wieder.
# - Hamburg und Leipzig halten Stundenwerte nur Wochen bis Monate vor (Leipzig: 31 Tage). Die
#   Zählkarte hebt sie selbst auf
#   („Gedächtnis“: raw/<code>/gedaechtnis/, Monatsdateien) und legt sie im selben Release ab
#   (Assets `<code>__<datei>`): vor dem Abruf holen, danach ablegen, was sich geändert hat –
#   nie mit weniger Werten (pipeline/werkzeuge/gedaechtnis.py). Scheitert das Holen, bricht der
#   Lauf ab, bevor etwas überschrieben wird.
name: Dauerzählstellen bauen

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
  push:
    branches: [main]
    paths: [pipeline/src/zaehlkarte/dauer/**, pipeline/src/zaehlkarte/abruf.py, pipeline/src/zaehlkarte/ckan.py, pipeline/werkzeuge/gedaechtnis.py, .github/workflows/dauer.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: dauer
  cancel-in-progress: false

jobs:
  dauer:
    runs-on: ubuntu-24.04
    # Ein Lauf ohne Cache und ohne Gedächtnis (Berlin und Hamburg ganz) brauchte im
    # Werkzeug-Branch zwischen 15 und 59 Minuten, je nach Antwortzeit der Quellen.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/cache@v6
        with:
          path: pipeline/data/raw/berlin_viz
          key: dauer-roh-${{ github.run_id }}
          restore-keys: dauer-roh-
      - uses: actions/cache@v6  # eigener Cache, damit der von Berlin gültig bleibt
        with:
          path: |
            pipeline/data/raw/mobidata_rad
            pipeline/data/raw/muenchen_rad
            pipeline/data/raw/muenster_rad
            pipeline/data/raw/aachen_rad
            pipeline/data/raw/berlin_rad
          key: dauer-rad-roh-${{ github.run_id }}
          restore-keys: dauer-rad-roh-
      - uses: actions/cache@v6  # Rad, zweite Runde – eigener Cache, die anderen bleiben gültig
        with:
          path: |
            pipeline/data/raw/wuerzburg_rad
            pipeline/data/raw/rhein_kreis_neuss_rad
            pipeline/data/raw/dortmund_rad
            pipeline/data/raw/essen_rad
            pipeline/data/raw/rostock_rad
            pipeline/data/raw/bochum_rad
            pipeline/data/raw/leipzig_rad/standorte.csv
          key: dauer-rad2-roh-${{ github.run_id }}
          restore-keys: dauer-rad2-roh-
      - uses: actions/cache@v6  # Rad, dritte Runde (Düsseldorfs Server lehnt Abrufe oft ab)
        with:
          path: |
            pipeline/data/raw/bonn_rad
            pipeline/data/raw/duesseldorf_rad
          key: dauer-rad3-roh-${{ github.run_id }}
          restore-keys: dauer-rad3-roh-
      - uses: actions/cache@v6  # OSM-Abzug Hamburg (Straßennamen neuer Stellen): einmal laden, dann behalten
        with:
          path: pipeline/data/raw/osm
          key: osm-hamburg-1
      - name: Release anlegen bzw. Beschreibung nachführen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Kartendaten der Familie Dauerzählstellen (dauer.tar.gz, public/data/dauer/) und das Gedächtnis der Quellen, die ihre Stundenwerte nur Wochen bis Monate vorhalten (Assets <code>__<datei>; Monatsdateien mit den Stundenwerten wie geliefert – Hamburg: dl-de/by-2-0, Freie und Hansestadt Hamburg, Behörde für Verkehr und Mobilitätswende; Leipzig: dl-de/by-2-0, Stadt Leipzig; strassen.json: © OpenStreetMap-Mitwirkende, ODbL). Gebaut vom Workflow „Dauerzählstellen bauen“."
          if gh release view dauerzaehlstellen > /dev/null 2>&1; then
            gh release edit dauerzaehlstellen --notes "$notes"
          else
            gh release create dauerzaehlstellen --latest=false --title "Daten: Dauerzählstellen" --notes "$notes"
          fi
      - name: Gedächtnis holen
        working-directory: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv sync --locked && uv run python werkzeuge/gedaechtnis.py holen
      - name: Rohdaten holen
        working-directory: pipeline
        run: uv run zaehlkarte dauer fetch | tee "$RUNNER_TEMP/abruf.txt"
      - name: Gedächtnis ablegen
        working-directory: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python werkzeuge/gedaechtnis.py ablegen | tee -a "$RUNNER_TEMP/abruf.txt"
      - name: Kartendaten bauen
        working-directory: pipeline
        run: |
          uv run zaehlkarte dauer site > "$RUNNER_TEMP/site.txt"
          cat "$RUNNER_TEMP/abruf.txt" "$RUNNER_TEMP/site.txt" | tee "$RUNNER_TEMP/bericht.txt"
      - name: Als Release-Asset ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "$RUNNER_TEMP/dauer.tar.gz" -C public/data dauer
          gh release upload dauerzaehlstellen "$RUNNER_TEMP/dauer.tar.gz" "$RUNNER_TEMP/bericht.txt" --clobber
          {
            echo "Dauerzählstellen gebaut ($(du -h "$RUNNER_TEMP/dauer.tar.gz" | cut -f1) gepackt)."
            echo '```'
            head -80 "$RUNNER_TEMP/bericht.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Seite neu ausliefern
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
