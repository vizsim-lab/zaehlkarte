# Dauerzählstellen bauen: Rohdaten holen (Berlin: Archiv der Verkehrsdetektion), Kartendaten
# nach public/data/dauer/ schreiben und als Release-Asset „dauerzaehlstellen/dauer.tar.gz“
# ablegen – nicht ins Git (zu groß, ändert sich laufend). Danach startet der Workflow die CI auf
# main neu: Der Deploy-Job holt das Asset und liefert es mit der Seite aus.
#
# Läuft am 5. jedes Monats, von Hand und wenn sich Pipeline-Code oder dieser Workflow ändern.
# Die Rohdaten liegen zwischen den Läufen im Actions-Cache; geladen wird nur, was sich laut
# Prüfsumme (Content-MD5 des Archivs) geändert hat.
name: Dauerzählstellen bauen

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 5 * *"
  push:
    branches: [main]
    paths: [pipeline/src/zaehlkarte/dauer/**, .github/workflows/dauer.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: dauer
  cancel-in-progress: false

jobs:
  dauer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/cache@v6
        with:
          path: pipeline/data/raw/berlin_viz
          key: dauer-roh-${{ github.run_id }}
          restore-keys: dauer-roh-
      - name: Rohdaten holen
        working-directory: pipeline
        run: uv sync --locked && uv run zaehlkarte dauer fetch
      - name: Kartendaten bauen
        working-directory: pipeline
        run: uv run zaehlkarte dauer site | tee "$RUNNER_TEMP/bericht.txt"
      - name: Als Release-Asset ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "$RUNNER_TEMP/dauer.tar.gz" -C public/data dauer
          if ! gh release view dauerzaehlstellen > /dev/null 2>&1; then
            gh release create dauerzaehlstellen --latest=false --title "Daten: Dauerzählstellen" \
              --notes "Kartendaten der Familie Dauerzählstellen (public/data/dauer/), gebaut vom Workflow „Dauerzählstellen bauen“. Wird bei jedem Lauf ersetzt."
          fi
          gh release upload dauerzaehlstellen "$RUNNER_TEMP/dauer.tar.gz" "$RUNNER_TEMP/bericht.txt" --clobber
          {
            echo "Dauerzählstellen gebaut ($(du -h "$RUNNER_TEMP/dauer.tar.gz" | cut -f1) gepackt)."
            echo '```'
            head -60 "$RUNNER_TEMP/bericht.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Seite neu ausliefern
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
