name: "Zählungen melden"
description: "Du kennst Verkehrszählungen einer Kommune (offen, per Anfrage erhalten oder abgelehnt), die hier fehlen? Link reicht."
title: "[Zählungen] <Kommune>"
labels: ["datenquelle"]
body:
  - type: markdown
    attributes:
      value: |
        Danke! Kommune und Link genügen – den Rest schauen wir uns an.
        Gemeint sind gezählte Werte der Kommunen: Kurzzeitzählungen (Knotenpunkte, Querschnitte; Kfz, Rad, Fuß) und Dauerzählstellen (fest eingebaute Zähler mit Stunden- oder Tageswerten, ohne die von Bund und Ländern). Jahresmittel (DTV) und Verkehrsmengenkarten sammelt [vizsim/svz](https://github.com/vizsim/svz).
  - type: input
    id: kommune
    attributes:
      label: Kommune
      placeholder: "z. B. Rostock"
    validations:
      required: true
  - type: dropdown
    id: familie
    attributes:
      label: Welche Zählungen?
      options:
        - "Kurzzeitzählungen (einzelne Zähltage)"
        - "Dauerzählstellen (fest eingebaute Zähler)"
        - "beides oder unklar"
    validations:
      required: false
  - type: dropdown
    id: stand
    attributes:
      label: Was gibt es?
      options:
        - "offen veröffentlicht (Portal, Download)"
        - "auf Anfrage herausgegeben (IFG/UIG, z. B. FragDenStaat)"
        - "Anfrage abgelehnt oder gescheitert"
        - "wird erhoben, aber nicht veröffentlicht"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
      description: Portal, Download oder die Anfrage auf FragDenStaat.
      placeholder: "https://…"
    validations:
      required: true
  - type: textarea
    id: mehr
    attributes:
      label: Sonst noch was? (optional)
      description: Format (PDF, Excel, CSV), Zeitraum, Verkehrsarten, Lizenz – kein Muss.
